/* ===== Токены: масляная краска подъезда, побелка, трубка ЛДС, бумага журнала ===== */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --night:#141b16; --paint:#2f4a3a; --whitewash:#a7ab93; --tube:#dbe8c4;
  --paper:#d9cfb0; --paper-dk:#bfb391; --ink:#2b2520; --ink-blue:#2d3f6b;
  --red:#9e2a1f; --red-hi:#c8412f; --grn:#4f7d2e; --grn-hi:#79ad45; --brass:#c8962e;
  --wood:#3a281b; --wood-dk:#22160e; --metal:#737869; --metal-dk:#454940;
  --f-title:"Ruslan Display","Impact","Arial Black",serif;
  --f-hand:"Neucha","Segoe Print","Comic Sans MS",cursive;
  --f-type:"PT Mono","Courier New",monospace;
}
/* Игра всегда ночная: тёмная тема совпадает со светлой намеренно */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#141b16; } }
:root[data-theme="dark"]{ --night:#141b16; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#0b0f0c;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{height:100%;color:var(--ink)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px dashed var(--tube);outline-offset:2px}
.hidden{display:none!important}

#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--night)}
#stage{position:relative;flex:0 0 53%;overflow:hidden;background:#000;cursor:zoom-in}
#scene{width:100%;height:100%;display:block;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges}

/* ===== HUD ===== */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;z-index:3;pointer-events:none}
.hud-l,.hud-r{display:flex;align-items:center;gap:8px}
.clock{font-family:var(--f-type);font-size:17px;letter-spacing:1px;background:#0a0c09;color:#e2472f;padding:1px 6px 0;border:2px solid #2b2b24;text-shadow:0 0 6px rgba(226,71,47,.7)}
.night-lbl{font-family:var(--f-hand);font-size:17px;color:var(--tube);text-shadow:0 1px 0 #000}
.bulbs{display:flex;gap:5px}
.bulb{width:11px;height:15px;border-radius:50% 50% 42% 42%;background:#f6e6a4;box-shadow:0 0 8px #f1cf63;position:relative}
.bulb::after{content:"";position:absolute;left:3px;right:3px;bottom:-4px;height:4px;background:#8b8b80}
.bulb.dead{background:#34352f;box-shadow:none}
.bulb.breaking{animation:bulbDie .6s steps(6) forwards}
@keyframes bulbDie{0%,40%,80%{background:#fff;box-shadow:0 0 14px #fff}20%,60%,100%{background:#34352f;box-shadow:none}}
.tally{font-family:var(--f-hand);font-size:15px;background:var(--paper);color:var(--red);padding:0 6px;transform:rotate(3deg);min-width:34px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.pause{pointer-events:auto;width:32px;height:30px;border:2px solid #3b3d33;background:#1a1d17;display:flex;gap:4px;align-items:center;justify-content:center;cursor:pointer}
.pause i{display:block;width:4px;height:12px;background:var(--tube)}

/* ===== Субтитры ===== */
.sub{position:absolute;left:8px;right:8px;bottom:16px;z-index:4;background:rgba(9,12,10,.86);color:#ebe6d2;font-family:var(--f-hand);font-size:18px;line-height:1.28;padding:6px 10px 8px 12px;border-left:3px solid var(--tube);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:auto}
.sub.show{opacity:1;transform:none}
.sub .who{display:block;font-family:var(--f-type);font-size:11px;color:#9fb08c;letter-spacing:.3px}
.sub.icom{border-left-color:var(--brass);font-style:italic}
.sub.icom .who{color:#d6b25c}
.sub.radio{border-left-color:#7fa0a8;font-family:var(--f-type);font-size:14px}
.sub.radio .who{color:#8fb3bb}
.sub.fake{border-left-color:var(--red-hi)}
.sub.me{border-left-color:#bfb391;color:#d8cfb0}
.sub.me .who{color:#bfb391}
.sub.boss{border-left-color:var(--red-hi);color:#f0d9cf}

#patience{position:absolute;left:12%;right:12%;bottom:6px;height:5px;background:#10150f;border:1px solid #000;z-index:4;opacity:0;transition:opacity .3s}
#patience.on{opacity:1}
#patience .fill{height:100%;background:var(--tube);box-shadow:0 0 6px var(--tube);transform-origin:left center}
#patience.low .fill{background:var(--red-hi);box-shadow:0 0 8px var(--red-hi);animation:tubeFlick .35s steps(2) infinite}
@keyframes tubeFlick{50%{opacity:.35}}

/* ===== Стол вахтёра ===== */
#desk{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 10px 12px;
  background:
   radial-gradient(ellipse at 50% -10%,rgba(240,200,120,.16),transparent 60%),
   repeating-linear-gradient(92deg,rgba(0,0,0,.0) 0 11px,rgba(0,0,0,.12) 11px 13px,rgba(255,220,170,.03) 13px 19px),
   linear-gradient(#3e2b1d,#2a1b11);
  box-shadow:inset 0 6px 10px rgba(0,0,0,.6)}
.tools{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:6px 6px}
.tool{position:relative;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;transition:transform .08s,filter .2s}
.tool .spr{width:46px;height:46px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45));transform:rotate(var(--r,0deg))}
.tool .tape{font-family:var(--f-hand);font-size:14px;line-height:1.1;background:#d8cd9b;color:#3a2f22;padding:1px 7px 2px;transform:rotate(var(--tr,-2deg));box-shadow:0 1px 0 rgba(0,0,0,.4);white-space:nowrap}
.tool:active{transform:scale(.92)}
.tool.locked{filter:grayscale(1) brightness(.45);pointer-events:none}
.tool.used .tape{background:#bfb07a}
.tool .dot{position:absolute;top:8%;right:16%;width:9px;height:9px;border-radius:50%;background:var(--red-hi);box-shadow:0 0 6px var(--red-hi);display:none}
.tool .key{display:none;position:absolute;top:4%;left:12%;font-family:var(--f-type);font-style:normal;font-size:12px;line-height:1;color:#d8cd9b;border:1px solid #6b5a40;padding:2px 4px;background:rgba(0,0,0,.35)}
.tool.ping .dot{display:block;animation:tubeFlick .8s steps(2) infinite}

.plate{position:relative;flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:9px 14px 10px;
  background:linear-gradient(180deg,#80867a,#5b6056 70%,#50554c);border:2px solid #2d3029;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.3),0 5px 0 #15160f}
.plate::before,.plate::after{content:"";position:absolute;top:6px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9ccc0,#50544a);box-shadow:inset 0 0 0 1px #2d3029}
.plate::before{left:6px}.plate::after{right:6px}
.bigbtn{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;cursor:pointer}
.bigbtn .cap{width:62px;height:62px;border-radius:50%;transition:transform .07s,box-shadow .07s;border:3px solid #23251f}
.bigbtn.in .cap{background:radial-gradient(circle at 34% 30%,#a9d97a,var(--grn-hi) 30%,var(--grn) 62%,#2d4a19);box-shadow:0 6px 0 #1f3311,0 9px 12px rgba(0,0,0,.55),inset 0 -5px 7px rgba(0,0,0,.35)}
.bigbtn.out .cap{background:radial-gradient(circle at 34% 30%,#f09a86,var(--red-hi) 30%,var(--red) 62%,#551510);box-shadow:0 6px 0 #3d0f0a,0 9px 12px rgba(0,0,0,.55),inset 0 -5px 7px rgba(0,0,0,.35)}
.bigbtn:active .cap,.bigbtn.pressed .cap{transform:translateY(5px) scale(1.04,.94)}
.bigbtn.in:active .cap,.bigbtn.in.pressed .cap{box-shadow:0 1px 0 #1f3311,0 2px 4px rgba(0,0,0,.5),inset 0 -2px 4px rgba(0,0,0,.35)}
.bigbtn.out:active .cap,.bigbtn.out.pressed .cap{box-shadow:0 1px 0 #3d0f0a,0 2px 4px rgba(0,0,0,.5),inset 0 -2px 4px rgba(0,0,0,.35)}
.bigbtn .lbl{font-family:var(--f-title);font-size:13px;background:#1e201b;color:#dcd6bb;padding:2px 9px 3px;box-shadow:inset 0 0 0 1px #3a3d33}
.bigbtn:disabled{cursor:default}
.bigbtn:disabled .cap{filter:saturate(.25) brightness(.6)}

/* ===== Выдвижной лист (журнал, паспорт…) ===== */
#sheet{position:absolute;left:0;right:0;bottom:0;height:61%;z-index:10;display:flex;flex-direction:column;transform:translateY(104%);transition:transform .34s cubic-bezier(.2,.9,.25,1.08);background:#1c231d;box-shadow:0 -10px 24px rgba(0,0,0,.6)}
#sheet.open{transform:translateY(0)}
.sheet-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 10px 4px;background:#141a15;position:relative;touch-action:none}
.grip{position:absolute;left:50%;top:4px;width:44px;height:4px;margin-left:-22px;background:#4a5447}
.sheet-title{font-family:var(--f-hand);font-size:18px;color:var(--tube);padding-top:4px}
.sheet-close{border:0;background:var(--paper);color:var(--ink);font-family:var(--f-hand);font-size:16px;padding:2px 12px 3px;transform:rotate(1.5deg);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.sheet-body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}

/* Журнал */
.jtabs{display:flex;gap:4px;overflow-x:auto;padding:6px 8px 0;background:#26352a;scrollbar-width:none}
.jtabs::-webkit-scrollbar{display:none}
.jtab{flex:0 0 auto;border:0;font-family:var(--f-type);font-size:12px;padding:5px 7px 4px;background:#b9ad86;color:#2b2520;cursor:pointer;min-width:36px}
.jtab.on{background:var(--paper);transform:translateY(1px)}
.journal{background:var(--paper);min-height:calc(100% - 34px);position:relative;
  background-image:linear-gradient(90deg,transparent 30px,rgba(158,42,31,.35) 30px 31px,transparent 31px),repeating-linear-gradient(180deg,transparent 0 25px,rgba(45,63,107,.22) 25px 26px);
  font-family:var(--f-hand);color:var(--ink);padding:12px 14px 56px 40px;touch-action:pan-y}
.jpage{display:grid;grid-template-columns:92px 1fr;gap:12px;animation:pageIn .22s ease-out}
@keyframes pageIn{from{opacity:0;transform:translateX(var(--dx,20px))}to{opacity:1;transform:none}}
.jphoto{position:relative;width:92px;height:116px;background:#e9e2cc;padding:4px;box-shadow:0 2px 3px rgba(0,0,0,.35);transform:rotate(-2deg)}
.jphoto canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.jphoto::before{content:"";position:absolute;top:-7px;left:26px;width:38px;height:13px;background:rgba(221,208,150,.8);transform:rotate(3deg)}
.jrow{font-size:18px;line-height:1.35;margin-bottom:2px}
.jk{display:block;font-family:var(--f-type);font-size:10.5px;color:#76695a;line-height:1.2}
.jnote{color:var(--red);font-size:19px;line-height:1.25;margin-top:8px;transform:rotate(-1.2deg)}
.jnote.strong{font-size:21px;border:2px solid var(--red);padding:2px 6px;display:inline-block}
.jnav{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:space-between;padding:0 12px 0 40px;align-items:center}
.jnav button{border:0;background:#c2b58e;font-family:var(--f-hand);font-size:17px;padding:3px 12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.jnav span{font-family:var(--f-type);font-size:11px;color:#76695a}
.rules{font-size:17px;line-height:1.38;padding-right:4px}
.rules h3{font-family:var(--f-title);font-weight:400;font-size:19px;margin:0 0 6px;color:var(--ink-blue)}
.rules ol{margin:0;padding-left:20px}
.rules li{margin-bottom:4px}
.rules .tonight{color:var(--red);font-size:19px;margin:10px 0 0;transform:rotate(-1deg)}

/* Паспорт */
.pwrap{padding:14px 12px 20px}
.passport{position:relative;display:grid;grid-template-columns:96px 1fr 18px;gap:10px;padding:12px 10px 14px 12px;color:#2b2520;font-family:var(--f-type);
  background:repeating-radial-gradient(circle at 20% 30%,#ecdcd5 0 2px,#e4d0c8 2px 4px),#e8d6ce;background-blend-mode:multiply;border:1px solid #a58a80;box-shadow:0 6px 0 rgba(0,0,0,.35);transform:rotate(-.6deg)}
.passport .hdr{grid-column:1/-1;font-size:10px;letter-spacing:.5px;color:#8b5a50;text-align:center;border-bottom:1px solid #c7a79d;padding-bottom:4px}
.pphoto{width:96px;height:122px;background:#ddd;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.pphoto canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.pk{font-size:10px;color:#8b6a60;display:block;margin-top:5px}
.pv{font-size:15px;font-weight:700;letter-spacing:.3px}
.pser{writing-mode:vertical-rl;transform:rotate(180deg);color:#b0392b;font-size:14px;letter-spacing:2px;text-align:center}
.stamp{margin-top:12px;border:2px solid #3b4f8a;color:#3b4f8a;padding:6px 8px;font-family:var(--f-type);font-size:13px;line-height:1.35;transform:rotate(-2.5deg);opacity:.9;background:rgba(232,214,206,.6)}
.stamp b{display:block;font-size:10px;letter-spacing:.5px}

/* Сумка */
.bag{padding:14px;display:grid;align-content:start;grid-template-columns:repeat(3,1fr);gap:12px;background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px),#2e2721;min-height:100%}
.item{border:0;background:#d2c7a6;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;transform:rotate(var(--r));box-shadow:0 4px 0 rgba(0,0,0,.45);cursor:pointer;font-family:var(--f-hand);font-size:15px;color:#2b2520;animation:drop .35s cubic-bezier(.3,1.5,.5,1) both}
.item .spr{width:48px;height:48px}
.item.sel{outline:2px solid var(--red-hi)}
@keyframes drop{from{opacity:0;transform:translateY(-24px) rotate(var(--r))}}
.idesc{grid-column:1/-1;background:var(--paper);font-family:var(--f-hand);font-size:18px;line-height:1.3;padding:8px 10px;min-height:48px;box-shadow:0 3px 0 rgba(0,0,0,.35)}

/* Телефон посетителя */
.phone{margin:12px auto 18px;width:min(300px,90%);background:#151515;border:9px solid #202020;border-radius:20px;box-shadow:0 8px 0 rgba(0,0,0,.4);overflow:hidden}
.phone.button{border-radius:12px;border-width:12px}
.pscr{background:#dfe2d6;min-height:260px;font-family:var(--f-type);font-size:13px;color:#1f2a22}
.ptabs{display:flex;background:#2f3a33}
.ptab{flex:1;border:0;background:none;color:#b8c4b4;font-family:var(--f-type);font-size:12px;padding:7px 2px;cursor:pointer}
.ptab.on{background:#dfe2d6;color:#1f2a22}
.plist{padding:8px}
.pmsg{background:#fff;padding:6px 8px;margin-bottom:6px;border-left:3px solid #6b8a74}
.pmsg b{display:block;font-size:11px;color:#4d6453}
.pmsg i{float:right;font-style:normal;font-size:10px;color:#889}
.pcall{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px dashed #aab}
.pgal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pgal figure{margin:0;background:#fff;padding:3px}
.pgal canvas{width:100%;image-rendering:pixelated;display:block}
.pgal figcaption{font-size:10px;color:#556;padding-top:2px}
.pempty{padding:28px 10px;text-align:center;color:#667}

/* Вопросы */
.pad{margin:12px;background:#ebe5cf;padding:10px 12px 14px 34px;font-family:var(--f-hand);position:relative;
  background-image:linear-gradient(90deg,transparent 24px,rgba(158,42,31,.4) 24px 25px,transparent 25px),repeating-linear-gradient(180deg,transparent 0 27px,rgba(45,63,107,.2) 27px 28px);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.q{display:block;width:100%;text-align:left;border:0;background:none;font-size:19px;padding:4px 0;color:var(--ink);cursor:pointer;line-height:1.35}
.q::before{content:"";display:inline-block;width:12px;height:12px;border:2px solid #4b4033;margin-right:8px;vertical-align:-1px}
.q.asked::before{background:linear-gradient(45deg,transparent 40%,var(--ink-blue) 40% 60%,transparent 60%)}
.q:disabled{cursor:default}
.ans{color:var(--ink-blue);font-size:18px;padding:0 0 6px 20px;line-height:1.3}
.padhint{font-size:15px;color:#7a6c58;margin-top:8px}

/* Домофон */
.icom{margin:12px auto 16px;width:min(280px,88%);background:linear-gradient(#d2c6a3,#b9ad89);padding:12px;border:2px solid #8a7f62;box-shadow:0 7px 0 rgba(0,0,0,.4)}
.grill{height:22px;margin-bottom:10px;background:repeating-linear-gradient(90deg,#6f664f 0 3px,transparent 3px 6px);opacity:.7}
.lcd{background:#9db08b;color:#1e2a18;font-family:var(--f-type);font-size:26px;padding:4px 10px;text-align:right;box-shadow:inset 0 2px 4px rgba(0,0,0,.35);margin-bottom:10px;min-height:42px}
.lcd small{float:left;font-size:12px;padding-top:9px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.key{border:0;height:42px;background:#ece3c6;font-family:var(--f-type);font-size:20px;color:#2b2520;box-shadow:0 3px 0 #857a5d;cursor:pointer}
.key:active{transform:translateY(3px);box-shadow:0 0 0 #857a5d}
.key.call{background:#8eb06c}
.key.clr{background:#d59a86}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:0;background:#f1e8cc;font-family:var(--f-hand);font-size:15px;padding:3px 9px;cursor:pointer;box-shadow:0 2px 0 #857a5d}

/* Ящик и радио */
.drawer{padding:14px;min-height:100%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 9px,transparent 9px 17px),#4a3322}
.dnote{background:#e8dfb8;font-family:var(--f-hand);font-size:18px;line-height:1.32;padding:10px 12px;margin-bottom:12px;box-shadow:0 4px 0 rgba(0,0,0,.4);transform:rotate(var(--r,-1deg))}
.dnote b{font-family:var(--f-type);font-size:10px;color:#7a6c58;font-weight:400;display:block}
.radio{padding:14px;min-height:100%;background:#20261f}
.rbox{background:#3a3326;border:3px solid #1b1813;padding:12px;color:#d6d0b8;font-family:var(--f-type);font-size:14px;line-height:1.4}
.rdial{height:26px;margin-bottom:10px;background:linear-gradient(90deg,transparent 48%,var(--red-hi) 48% 50%,transparent 50%),repeating-linear-gradient(90deg,#c8bc92 0 1px,transparent 1px 10px),#16140f}
.rline{border-top:1px dashed #5b5240;padding:6px 0}
.rline.fake{color:#f0a896}
.rbtn{margin-top:10px;border:0;background:var(--paper);font-family:var(--f-hand);font-size:16px;padding:4px 12px;cursor:pointer}

/* ===== Записки прежнего вахтёра, тосты ===== */
.kuz-note{position:absolute;z-index:20;left:14px;right:14px;top:17%;background:#e9dea9;color:#2b2520;font-family:var(--f-hand);font-size:18px;line-height:1.3;padding:10px 12px 10px;box-shadow:0 8px 0 rgba(0,0,0,.4);transform:translateY(-30px) rotate(-1.5deg);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.3,1.4,.5,1)}
.kuz-note.show{opacity:1;transform:rotate(-1.5deg);pointer-events:auto}
.kuz-note::before{content:"";position:absolute;top:-8px;left:40%;width:60px;height:16px;background:rgba(214,202,140,.85);transform:rotate(-4deg)}
.kuz-note .sig{display:block;text-align:right;font-size:15px;color:#6b5f4d;margin-top:3px}
#toast{position:absolute;z-index:46;left:50%;top:12px;transform:translate(-50%,-80px);background:var(--paper);color:var(--ink);font-family:var(--f-hand);font-size:16px;padding:6px 14px 7px;box-shadow:0 4px 0 rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.3,1.4,.5,1);white-space:nowrap;max-width:92%}
#toast.show{transform:translate(-50%,0) rotate(-1deg)}
#toast b{font-family:var(--f-type);font-size:10px;display:block;color:#7a6c58;font-weight:400}

/* ===== Экраны меню ===== */
#screen{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;background:rgba(7,10,8,.78)}
#screen.show{display:flex}
#screen.clear{background:linear-gradient(180deg,rgba(7,10,8,.1) 0%,rgba(7,10,8,.2) 38%,rgba(7,10,8,.94) 58%)}
.title-wrap{padding:9vh 22px 0}
.title{font-family:var(--f-title);font-size:clamp(58px,19vw,104px);line-height:.9;color:var(--tube);margin:0;text-shadow:0 0 22px rgba(219,232,196,.45),4px 4px 0 #0b100c;animation:flick 6s infinite}
@keyframes flick{0%,86%,90%,100%{opacity:1}87%{opacity:.25}88%{opacity:1}89%{opacity:.4}}
.tag{font-family:var(--f-hand);font-size:19px;color:#c9d6b3;margin:8px 0 0 4px;text-shadow:0 1px 0 #000}
.card{background:var(--paper);color:var(--ink);font-family:var(--f-hand);margin:auto 20px 22px;padding:12px 16px 14px;box-shadow:0 10px 0 rgba(0,0,0,.4);transform:rotate(-.8deg);position:relative;
  background-image:repeating-linear-gradient(180deg,transparent 0 31px,rgba(45,63,107,.18) 31px 32px)}
.card::before{content:"";position:absolute;top:-9px;left:30px;width:70px;height:18px;background:rgba(214,202,140,.85);transform:rotate(-3deg)}
.card h2{font-family:var(--f-title);font-weight:400;font-size:24px;margin:2px 0 8px;color:var(--ink-blue)}
.card p{font-size:18px;line-height:1.35;margin:6px 0}
.mbtn{display:block;width:100%;text-align:left;border:0;background:none;border-bottom:1px dashed rgba(43,37,32,.3);font-family:var(--f-hand);font-size:23px;padding:6px 2px 7px;color:var(--ink);cursor:pointer}
.mbtn:last-child{border-bottom:0}
.mbtn:active{color:var(--red)}
.mbtn small{display:block;font-family:var(--f-type);font-size:11px;color:#76695a}
.mbtn.main{font-size:27px}
.mbtn:disabled{opacity:.4}
.row2{display:flex;gap:10px;margin-top:8px}
.row2 .mbtn{border:0;background:#c9bc93;text-align:center;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.night-card{margin:auto 18px}
.night-num{font-family:var(--f-title);font-size:clamp(46px,14vw,70px);color:var(--tube);text-align:center;margin:12vh 0 0;text-shadow:0 0 18px rgba(219,232,196,.35),3px 3px 0 #000}
.rule-red{color:var(--red);font-size:20px;line-height:1.3;transform:rotate(-1deg);margin:10px 0}
.sumlist{margin:6px 0 8px}
.srow{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(43,37,32,.25)}
.srow canvas{width:40px;height:50px;image-rendering:pixelated;background:#cfc7ab}
.sname{font-size:17px;line-height:1.15}
.sname small{display:block;font-family:var(--f-type);font-size:10.5px;color:#6b5f4d;line-height:1.3}
.sres{font-family:var(--f-type);font-size:12px;text-align:right}
.ok{color:#3d6a22}.bad{color:var(--red)}
.clue{font-family:var(--f-type);font-size:10.5px;line-height:1.35}
.clue.seen{color:#3d6a22}.clue.miss{color:var(--red)}
.stat{display:flex;justify-content:space-between;font-size:19px;padding:2px 0}
.stat b{font-family:var(--f-type);font-size:16px}
.ach{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(43,37,32,.25)}
.ach .medal{width:26px;height:26px;flex:0 0 auto;background:#8d8a7c;clip-path:polygon(50% 0,62% 34%,100% 38%,70% 60%,80% 100%,50% 78%,20% 100%,30% 60%,0 38%,38% 34%)}
.ach.on .medal{background:var(--brass)}
.ach div{font-size:18px;line-height:1.15}
.ach small{display:block;font-family:var(--f-type);font-size:10.5px;color:#6b5f4d}
.ach:not(.on) div{opacity:.55}
.lb{display:grid;grid-template-columns:24px 1fr auto;gap:6px;font-size:18px;padding:3px 0;border-bottom:1px dashed rgba(43,37,32,.25)}
.lb b{font-family:var(--f-type);font-size:15px}
.set{display:flex;justify-content:space-between;align-items:center;font-size:19px;padding:6px 0;border-bottom:1px dashed rgba(43,37,32,.25);gap:10px}
.set input[type=range]{width:46%;accent-color:var(--red)}
.tog{border:0;background:#c9bc93;font-family:var(--f-hand);font-size:17px;padding:2px 12px;min-width:72px;cursor:pointer}
.tog.on{background:var(--grn-hi)}
.ending-title{font-family:var(--f-title);font-size:clamp(34px,11vw,54px);color:var(--tube);text-align:center;margin:10vh 16px 0;text-shadow:3px 3px 0 #000}

/* ===== Спецэффекты ===== */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:50;image-rendering:pixelated;display:none;pointer-events:none}
#flash{position:absolute;inset:0;z-index:49;background:var(--red);opacity:0;pointer-events:none}
#stampFx{position:absolute;z-index:47;left:50%;top:34%;font-family:var(--f-title);font-size:38px;color:var(--red-hi);border:5px solid var(--red-hi);padding:4px 14px 6px;opacity:0;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);background:rgba(233,222,169,.1)}
#stampFx.slam{animation:slam 1.5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4)}12%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.ov{position:absolute;inset:0;pointer-events:none}
.scan{z-index:41;background:repeating-linear-gradient(180deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);opacity:.4}
.grain{z-index:42;opacity:.1;mix-blend-mode:overlay;background-size:160px 160px;animation:grain .45s steps(3) infinite}
@keyframes grain{0%{background-position:0 0}33%{background-position:-47px 31px}66%{background-position:23px -58px}100%{background-position:0 0}}
.vig{z-index:43;background:radial-gradient(ellipse at 50% 38%,transparent 52%,rgba(0,0,0,.7) 100%)}
/* ===== Версия для ПК: сцена слева во всю высоту, стол справа ===== */
html.pc #app{max-width:none;flex-direction:row;--sw:min(calc(100vh * .889),62vw)}
html.pc #stage{flex:0 0 var(--sw);width:var(--sw);height:100%}
html.pc #scene{object-fit:contain;background:#000}
html.pc #desk{flex:1 1 auto;padding:4vh 3vw;gap:3vh;justify-content:center;box-shadow:inset 10px 0 18px rgba(0,0,0,.6)}
html.pc .tools{flex:0 1 auto;height:62vh;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:1.6vh 2vw}
html.pc .tool .spr{width:clamp(48px,7vh,78px);height:clamp(48px,7vh,78px)}
html.pc .tool .tape{font-size:clamp(15px,2.1vh,21px)}
html.pc .tool .key{display:block;position:static;order:3;margin-top:3px;padding:1px 6px;font-size:12px;height:auto}
html.pc .tools{width:100%;max-width:560px;align-self:center}
html.pc .sheet-body>div{min-height:100%}
html.pc .journal{min-height:calc(100vh - 80px)}
html.pc .jrow{font-size:21px}html.pc .jk{font-size:12px}html.pc .rules{font-size:19px}
html.pc .tool:hover{transform:translateY(-3px);filter:brightness(1.15)}
html.pc .tool:hover .tape{background:#ece0a8}
html.pc .plate{padding:2vh 2vw;max-width:520px;width:100%;align-self:center}
html.pc .bigbtn .cap{width:clamp(64px,10vh,96px);height:clamp(64px,10vh,96px)}
html.pc .bigbtn .lbl{font-size:15px}
html.pc .bigbtn.in .lbl::after{content:"  Y";color:#8f9a86}
html.pc .bigbtn.out .lbl::after{content:"  N";color:#8f9a86}
html.pc .bigbtn:not(:disabled):hover .cap{filter:brightness(1.12)}
html.pc #sheet{left:var(--sw);top:0;height:100%;transform:translateX(104%);box-shadow:-10px 0 24px rgba(0,0,0,.6)}
html.pc #sheet.open{transform:none}
html.pc .sheet-title{font-size:22px}
html.pc .sheet-close::after{content:"  Esc";font-family:var(--f-type);font-size:11px;color:#76695a}
html.pc .sub{font-size:clamp(18px,2.6vh,26px);left:3%;right:3%;bottom:3.5%}
html.pc .sub .who{font-size:13px}
html.pc .clock{font-size:22px}
html.pc .night-lbl{font-size:20px}
html.pc #screen{align-items:center}
html.pc .card{width:min(640px,92%);margin-left:auto;margin-right:auto}
html.pc #screen.clear{background:linear-gradient(90deg,rgba(7,10,8,.15) 0%,rgba(7,10,8,.35) 45%,rgba(7,10,8,.94) 70%)}
html.pc #screen.clear .title-wrap{align-self:flex-start;padding:10vh 5vw 0}
html.pc #screen.clear .card{margin:auto 6vw auto auto;width:min(520px,40vw)}
html.pc .title{font-size:clamp(70px,11vw,150px)}
html.pc .tag{font-size:22px;max-width:40vw}
html.pc .kuz-note{left:2vw;right:auto;width:min(460px,calc(var(--sw) - 4vw));top:14%}
html.pc .journal{padding-left:48px}
html.pc .jpage{grid-template-columns:130px 1fr}
html.pc .jphoto{width:130px;height:162px}
html.pc .mbtn:hover{color:var(--red)}
html.pc .ending-title,html.pc .night-num{font-size:clamp(48px,8vw,96px)}
html.pc ::-webkit-scrollbar{width:10px}html.pc ::-webkit-scrollbar-thumb{background:#4a5447}
@media (prefers-reduced-motion: reduce){.grain{animation:none}.title{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="scene" width="160" height="180" aria-label="Подъезд за окном вахты"></canvas>
    <div id="hud" class="hidden">
      <div class="hud-l"><div id="clock" class="clock">23:40</div><div id="nightLbl" class="night-lbl"></div></div>
      <div class="hud-r"><div class="bulbs" id="bulbs" aria-label="Жизни"></div><div class="tally" id="tally" aria-label="Жалобы"></div><button id="pauseBtn" class="pause" aria-label="Пауза"><i></i><i></i></button></div>
    </div>
    <div id="sub" class="sub"><span class="who"></span><span class="txt"></span></div>
    <div id="patience"><div class="fill"></div></div>
  </div>
  <div id="desk">
    <div class="tools" id="tools"></div>
    <div class="plate">
      <button class="bigbtn in" id="btnIn" disabled><span class="cap"></span><span class="lbl">ВПУСТИТЬ</span></button>
      <button class="bigbtn out" id="btnOut" disabled><span class="cap"></span><span class="lbl">НЕ ВПУСКАТЬ</span></button>

const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a, b) => a + Math.random() * (b - a),
  ri: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: a => a[Math.floor(Math.random() * a.length)],
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  pad: (n, l = 2) => String(n).padStart(l, '0'),
  wait: ms => new Promise(r => setTimeout(r, ms)),
  // Осветлить/затемнить HEX-цвет: amt от -1 до 1
  shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
    else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
    return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
  },
};

    // ручка и листок

    P(40, 160, 14, 1, '#2d3f6b'); P(53, 160, 2, 1, '#c8962e');

    P(127, 136, 11, 8, '#b0a37a'); P(127, 136, 11, 1, '#e3d7a6'); P(129, 138, 1, 5, '#8a7d56'); P(132, 138, 1, 5, '#8a7d56'); P(135, 138, 1, 5, '#8a7d56');
    P(138, 137, 2, 1, '#b0a37a'); P(139, 138, 1, 4, '#b0a37a'); P(138, 141, 2, 1, '#b0a37a');

  }
  // силуэты очереди
  function buildQueue() {
    const c = Px.mk(70, 110), x = c.getContext('2d');
    Px.drawPerson(x, 35, 10, { skin: 0, hair: 'short', hairC: '#000', beard: 'none', coat: '#000', age: 'mid' }, { sil: '#0c110d' });
    return c;
  }
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hash(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; }

  /* ---------- Частицы (пулы фиксированного размера) ---------- */
  function initParticles() {
    S.dust = Array.from({ length: 34 }, () => ({ x: Math.random() * 90, y: 10 + Math.random() * 110, vx: U.rand(-2, 2), vy: U.rand(-1.5, 1.5), a: Math.random() }));
    S.moths = Array.from({ length: 3 }, (_, i) => ({ ph: i * 2.1, r: 6 + i * 3 }));
    S.steam = Array.from({ length: 6 }, (_, i) => ({ x: 132, y: 128 - i * 3, a: i / 6, life: i / 6 }));
    S.drops = [];
  }
  function cracksGen() {
    const cr = [], ox = 98, oy = 60;
    for (let i = 0; i < 11; i++) {
      let ang = i / 11 * Math.PI * 2 + U.rand(-.2, .2), x = ox, y = oy; const seg = [];
      for (let k = 0; k < 7; k++) { ang += U.rand(-.45, .45); const l = U.rand(5, 12); x += Math.cos(ang) * l; y += Math.sin(ang) * l; seg.push([x, y]); }
      cr.push(seg);
    }
    return cr;
  }

  /* ---------- Обновление ---------- */
  function update(dt) {
    if (S.hit > 0) { S.hit -= dt; return; }                 // хитстоп
    S.t += dt;
    for (let i = tws.length - 1; i >= 0; i--) {
      const w = tws[i]; w.t += dt; const k = Math.min(1, w.t / w.dur); w.fn(k);
      if (k >= 1) { tws.splice(i, 1); w.res(); }
    }
    // шаги
    if (S.walking) { S.walkT += dt; S.stepT -= dt; if (S.stepT <= 0) { S.stepT = .36; Snd.step(S.sc); } }
    if (S.land > 0) S.land = Math.max(0, S.land - dt * 5);
    // моргание
    if (S.v && !(S.v.flags && S.v.flags.noBlink)) {
      if (S.blinking > 0) S.blinking -= dt;
      else { S.blinkT -= dt; if (S.blinkT <= 0) { S.blinking = .13; S.blinkT = U.rand(CONFIG.blink[0], CONFIG.blink[1]); } }
    }
    if (S.reveal > 0) S.reveal = Math.max(0, S.reveal - dt);
    // мерцание лампы
    if (!S.lampBroken) {
      if (S.flickT > 0) { S.flickT -= dt; S.flick = Math.random() < .5 ? .25 : .7; if (S.flickT <= 0) S.flick = 1; }
      else if (Math.random() < S.flickRate * dt * 3) { S.flickT = U.rand(.06, .28); Snd.click(); }
    } else S.flick = .06;
    S.dark += (S.darkTarget - S.dark) * Math.min(1, dt * 2.5);
    S.zoom += (S.zoomTarget - S.zoom) * Math.min(1, dt * 9);
    S.shakeP = Math.max(0, S.shakeP - dt * 3.2);
    // лифт живёт своей жизнью
    if (Math.abs(S.lift - S.liftTarget) > .01) S.lift += Math.sign(S.liftTarget - S.lift) * Math.min(Math.abs(S.liftTarget - S.lift), dt * 1.6);
    S.liftIdleT -= dt;
    if (S.liftIdleT <= 0) { S.liftIdleT = U.rand(14, 30); if (!S.v || S.mode === 'title') { S.liftTarget = U.ri(1, 9); if (S.mode !== 'title') Snd.lift(); } }
    // призрак в зеркале на титуле
    if (S.mode === 'title') { S.ghostT -= dt; if (S.ghostT <= 0) { S.ghost = 1.4; S.ghostT = U.rand(7, 13); } }
    if (S.ghost > 0) S.ghost -= dt;
    // пыль, мотыльки, пар, капли
    S.dust.forEach(d => { d.x += d.vx * dt; d.y += d.vy * dt; d.a += dt * .3; if (d.x < 0 || d.x > 96 || d.y < 8 || d.y > 124) { d.x = Math.random() * 90; d.y = 12 + Math.random() * 100; } });
    S.steam.forEach(st => { st.life += dt * .35; if (st.life > 1) { st.life = 0; st.x = 131 + Math.random() * 3; } st.y = 128 - st.life * 22; st.x += Math.sin(S.t * 2 + st.y) * dt * 3; });
    S.dripT -= dt;
    if (S.dripT <= 0) { S.dripT = U.rand(3.5, 8); S.drops.push({ x: 105, y: 2, vy: 0 }); }
    for (let i = S.drops.length - 1; i >= 0; i--) { const d = S.drops[i]; d.vy += 220 * dt; d.y += d.vy * dt; if (d.y >= 127) { S.drops.splice(i, 1); Snd.drip(); for (let k = 0; k < 3; k++) S.sparks.push({ x: 105, y: 127, vx: U.rand(-20, 20), vy: U.rand(-30, -10), l: .3, c: '#8fb0a0' }); } }
    for (let i = S.sparks.length - 1; i >= 0; i--) { const q = S.sparks[i]; q.l -= dt; q.vy += 120 * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.l <= 0) S.sparks.splice(i, 1); }
    if (S.sparks.length > 80) S.sparks.splice(0, S.sparks.length - 80);
    if (S.jit > 0) S.jit -= dt;
  }

  /* ---------- Рендер ---------- */
  function renderPerson(v) {
    p.clearRect(0, 0, 70, 110);
    const breath = S.walking ? 0 : (Math.sin(S.t * 1.8) > .55 ? -1 : 0);
    Px.drawPerson(p, 35, 10, v.app, { blink: S.blinking > 0, talk: S.talk && Math.sin(S.t * 26) > -.2, reveal: S.reveal > 0, breath });
    s.clearRect(0, 0, 70, 110); s.globalCompositeOperation = 'source-over'; s.drawImage(pc, 0, 0);
    s.globalCompositeOperation = 'source-in'; s.fillStyle = '#000'; s.fillRect(0, 0, 70, 110); s.globalCompositeOperation = 'source-over';
  }
  function personPos() {
    const v = S.v; let ox = 0;
    if (v.flags.sway) ox += Math.sin(S.t * 1.3) * 2.5;
    if (v.flags.jitter && Math.random() < .3) ox += U.ri(-1, 1);
    if (S.reveal > 0 || v.kind === 'boss' && Math.random() < .03) ox += U.ri(-2, 2);
    const bob = S.walking ? -Math.abs(Math.sin(S.walkT * 8.6)) * 2 : 0;
    const sq = S.land;                                       // squash при остановке
    const w = 70 * S.sc * (1 + sq * .05), h = 110 * S.sc * (1 - sq * .04);
    return { x: S.x + ox - w / 2, y: S.bottom - h + bob, w, h };
  }
  function render() {
    b.globalAlpha = 1; b.globalCompositeOperation = 'source-over';
    b.drawImage(bg, 0, 0);
    // лифт: двери и индикатор этажа
    const op = S.doors * 16;
    b.fillStyle = '#3d3a24'; b.fillRect(117, 44, 32, 82);
    b.fillStyle = 'rgba(219,200,120,.25)'; b.fillRect(117 + 16 - op, 44, op * 2, 82);
    b.fillStyle = '#5d6158'; b.fillRect(117 - op, 44, 16, 82); b.fillRect(133 + op, 44, 16, 82);
    b.fillStyle = '#6f7469'; b.fillRect(117 - op, 44, 1, 82); b.fillRect(133 + op, 44, 1, 82);
    b.fillStyle = '#23261f'; b.fillRect(115, 42, 2, 84); b.fillRect(149, 42, 2, 84);
    Px.text(b, String(Math.round(S.lift)), 131, 32, '#e2472f');
    b.fillStyle = 'rgba(226,71,47,.18)'; b.fillRect(126, 31, 14, 7);
    // зеркало: отражение посетителя (двойники отражения не имеют)
    b.save(); b.beginPath(); b.rect(44, 38, 15, 25); b.clip();
    b.fillStyle = '#56645a'; b.fillRect(44, 38, 15, 25);
    b.fillStyle = 'rgba(219,232,196,.15)'; b.fillRect(44, 38, 4, 25);
    if (S.v && S.alpha > .5 && !S.v.flags.mirror && S.x > 20 && S.sc > .8) {
      renderPerson(S.v);
      b.globalAlpha = .75; b.save(); b.translate(62 + (80 - S.x) * .15, 0); b.scale(-1, 1);
      b.drawImage(pc, 0, 0, 70, 110, 0, 42, 22, 35); b.restore(); b.globalAlpha = 1;
    }
    if (S.ghost > 0) {
      const a = Math.min(1, S.ghost) * (Math.random() < .2 ? .3 : .8);
      b.globalAlpha = a; b.drawImage(qsil, 0, 0, 70, 110, 41, 40, 22, 35);
      b.fillStyle = '#b9bdb0'; b.fillRect(50, 45, 4, 5); b.fillStyle = '#000'; b.fillRect(50, 47, 1, 1); b.fillRect(52, 47, 1, 1); b.globalAlpha = 1;
    }
    b.fillStyle = 'rgba(255,255,255,.08)'; for (let i = 0; i < 6; i++) b.fillRect(46 + i, 58 - i * 3, 1, 1);
    b.restore();
    // очередь у входа
    const qn = Math.min(3, S.queue);
    for (let i = 0; i < qn; i++) {
      const qx = 6 + i * 11 + Math.sin(S.t * .7 + i) * .8, sc = .42;
      b.globalAlpha = .25; b.drawImage(qsil, qx + 4, 126 - 110 * sc + 1, 70 * sc, 110 * sc);
      b.globalAlpha = .95; b.drawImage(qsil, qx, 126 - 110 * sc, 70 * sc, 110 * sc); b.globalAlpha = 1;
    }
    // посетитель и его тень

      const q = personPos();
      const wrong = S.v.flags.shadow;
      b.globalAlpha = .34 * S.alpha * S.flick;
      b.drawImage(sil, q.x + (wrong ? -13 : 13) * S.sc, q.y + 3 * S.sc, q.w * 1.04, q.h);
      b.globalAlpha = S.alpha; b.drawImage(pc, q.x, q.y, q.w, q.h); b.globalAlpha = 1;
    }
    // пыль в свете лампы, мотыльки, капли
    S.dust.forEach(d => { const a = (.25 + .25 * Math.sin(d.a * 4)) * S.flick; b.fillStyle = `rgba(230,236,210,${a})`; b.fillRect(d.x | 0, d.y | 0, 1, 1); });
    if (!S.lampBroken) S.moths.forEach(m => { const a = S.t * (1.7 + m.r * .05) + m.ph; b.fillStyle = '#2b2d27'; const mx = LAMP.x + Math.cos(a) * m.r * 1.6 + Math.sin(a * 3.1) * 3, my = LAMP.y + 5 + Math.sin(a * 1.3) * m.r * .6; b.fillRect(mx | 0, my | 0, Math.sin(S.t * 30 + m.ph) > 0 ? 2 : 1, 1); });
    S.drops.forEach(d => { b.fillStyle = '#9fc0b0'; b.fillRect(d.x, d.y | 0, 1, 2); });
    S.sparks.forEach(q => { b.fillStyle = q.c; b.fillRect(q.x | 0, q.y | 0, 1, 1); });

    if (lit > 0) { b.globalCompositeOperation = 'lighter'; const g = b.createRadialGradient(LAMP.x, 10, 2, LAMP.x, 30, 90); g.addColorStop(0, `rgba(219,232,196,${.16 * lit})`); g.addColorStop(1, 'rgba(0,0,0,0)'); b.fillStyle = g; b.fillRect(0, 0, W, 142); b.globalCompositeOperation = 'source-over'; }
    const dim = (1 - S.flick) * .55 + S.dark * .85;
    if (dim > 0) { b.fillStyle = `rgba(4,6,5,${Math.min(.94, dim)})`; b.fillRect(0, 0, W, 142); }
    // будка

    if (S.v && S.phase === 'idle') Px.drawHand(b, 84, 142, S.v.app, S.v.flags.finger);
    S.steam.forEach(st => { b.fillStyle = `rgba(230,230,220,${(1 - st.life) * .22})`; b.fillRect(st.x | 0, st.y | 0, 1, 2); });
    // трещины на стекле
    if (S.crack > 0) {
      b.strokeStyle = 'rgba(230,238,222,.75)'; b.lineWidth = 1; b.beginPath();
      S.cracks.forEach(seg => { const n = Math.ceil(seg.length * S.crack); b.moveTo(98.5, 60.5); for (let i = 0; i < n; i++) b.lineTo(Math.round(seg[i][0]) + .5, Math.round(seg[i][1]) + .5); });
      b.stroke();
      if (S.crack > .5) { b.fillStyle = 'rgba(230,238,222,.4)'; b.fillRect(96, 58, 5, 5); }

    const sw = W / z, shh = H / z;
    let sx = U.clamp(FACE.x - sw / 2, 0, W - sw), sy = U.clamp(FACE.y - shh * .45, 0, H - shh);
    const sp = S.shakeP * S.shakeP * 6;
    out.fillStyle = '#000'; out.fillRect(0, 0, W, H);
    out.drawImage(buf, sx, sy, sw, shh, Math.round(U.rand(-sp, sp)), Math.round(U.rand(-sp, sp)), W, H);
  }

  /* ---------- Скример ---------- */
  function screamer(app, soft) {
    if (soft) { S.darkTarget = .9; Snd.bad(); Snd.heart(); shake(.5); return U.wait(900).then(() => { S.darkTarget = 0; }); }
    return new Promise(res => {
      fxCv.style.display = 'block'; Snd.scream(); shake(1.4); S.hit = .08;
      const fl = document.getElementById('flash'); fl.style.transition = 'none'; fl.style.opacity = .85;
      let t = 0, last = performance.now();
      const loop = now => {
        const dt = (now - last) / 1000; last = now; t += dt;
        fx.setTransform(1, 0, 0, 1, 0, 0);
        const k = 1 + Math.min(.35, t * .6);
        fx.save(); fx.translate(45, 60); fx.scale(k, k); fx.translate(-45 + U.ri(-2, 2), -60 + U.ri(-2, 2));
        Px.drawMonster(fx, app, t); fx.restore();
        if (Math.random() < .3) { fx.fillStyle = 'rgba(255,255,255,.2)'; fx.fillRect(0, U.ri(0, 120), 90, U.ri(1, 4)); }
        fl.style.opacity = Math.max(0, .85 - t * 1.6);
        if (t < 1.05) requestAnimationFrame(loop);
        else { fxCv.style.display = 'none'; fl.style.transition = 'opacity .4s'; fl.style.opacity = 0; res(); }
      };
      requestAnimationFrame(loop);
    });
  }
  function shake(pw) { S.shakeP = Math.max(S.shakeP, pw); }

  /* ---------- Посетитель: вход и уход ---------- */
  async function enter(v) {
    S.v = v; S.phase = 'in'; S.x = -40; S.sc = 1; S.bottom = 150; S.alpha = 1; S.reveal = 0; S.walking = true; S.stepT = 0; S.blinkT = 1;
    const d = 120 / CONFIG.walkSpeed;
    await tween(d, k => { S.x = -40 + 120 * easeOut(k); });
    S.walking = false; S.land = 1; S.phase = 'idle';
  }
  const easeOut = k => 1 - (1 - k) * (1 - k);
  const easeIn = k => k * k;
  async function leave(mode, floor = 1) {
    S.phase = 'out'; S.zoomTarget = 0; S.talk = false;
    if (mode === 'reveal') { S.reveal = .9; S.jit = .9; Snd.stat(.8); shake(.4); await U.wait(900); mode = 'out-fast'; }
    S.walking = true;
    if (mode === 'lift' && floor > 1) {
      await tween(1.4, k => { S.x = U.lerp(80, 133, k); S.sc = U.lerp(1, .55, easeOut(k)); S.bottom = U.lerp(150, 127, easeOut(k)); });
      S.walking = false;
      await tween(.5, k => { S.doors = k; });
      await tween(.4, k => { S.alpha = 1 - k; });
      await tween(.5, k => { S.doors = 1 - k; });
      Snd.lift(); S.liftTarget = floor;
    } else if (mode === 'lift' || mode === 'right') {
      await tween(1.3, k => { S.x = U.lerp(80, 185, easeIn(k)); S.sc = U.lerp(1, .75, k); S.bottom = U.lerp(150, 135, k); });
    } else if (mode === 'booth') {
      await tween(.9, k => { S.x = U.lerp(80, 190, easeIn(k)); S.sc = U.lerp(1, 1.3, k); S.bottom = U.lerp(150, 175, k); });
    } else {
      const fast = mode === 'out-fast';
      await tween(fast ? .8 : 1.5, k => { S.x = U.lerp(80, -45, easeIn(k)); S.sc = U.lerp(1, .9, k); });
    }
    S.walking = false; S.v = null; S.phase = 'none'; S.alpha = 1;
  }

  function init() {
    bg = buildBg(); fg = buildFg(); qsil = buildQueue(); initParticles();
  }

  return {
    S, init, update, render, enter, leave, screamer, shake,
    setMode(m) { S.mode = m; },
    toggleZoom() { if (!S.v || S.phase !== 'idle') { S.zoomTarget = 0; return false; } S.zoomTarget = S.zoomTarget ? 0 : 1; return !!S.zoomTarget; },
    zoomed: () => S.zoom > .5,
    startCracks() { S.cracks = cracksGen(); S.crack = 0; },
    reset() { S.v = null; S.phase = 'none'; S.crack = 0; S.cracks = []; S.lampBroken = false; S.dark = S.darkTarget = 0; S.dawn = 0; S.zoomTarget = 0; S.reveal = 0; S.queue = 0; S.doors = 0; S.talk = false; S.ghost = 0; tws.length = 0; },
    breakLamp() {
      S.lampBroken = true; Snd.shatter(); shake(1.1); S.hit = .09;
      for (let i = 0; i < 26; i++) S.sparks.push({ x: U.rand(14, 50), y: 8, vx: U.rand(-40, 40), vy: U.rand(-20, 40), l: U.rand(.4, 1), c: i % 3 ? '#eef5dc' : '#c8962e' });
    },
    tween,
  };
})();
