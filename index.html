const $ = id => document.getElementById(id);
function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const SET = Object.assign({ vol: .8, mute: false, text: 1, soft: false, vib: true }, Store.get('vahta.set', {}));
function saveSet() { Store.set('vahta.set', SET); Snd.setVolume(SET.vol); Snd.setMuted(SET.mute); }
function vib(p) { if (SET.vib && navigator.vibrate) try { navigator.vibrate(p); } catch (e) { /* нет вибро */ } }

const UI = (() => {
  const sub = $('sub'), subWho = sub.querySelector('.who'), subTxt = sub.querySelector('.txt');
  const sheet = $('sheet'), sheetTitle = sheet.querySelector('.sheet-title'), sheetBody = sheet.querySelector('.sheet-body');
  const TOOL_INFO = {
    journal: ['Журнал', 't_journal'], passport: ['Паспорт', 'alienpass'], bag: ['Сумка', 't_bag'], phone: ['Телефон', 't_phone'],
    questions: ['Вопросы', 't_questions'], intercom: ['Домофон', 't_intercom'], drawer: ['Ящик', 't_drawer'], radio: ['Радио', 't_radio'],
  };
  const ANYTIME = ['journal', 'drawer', 'radio'];
  let sayTok = 0, skip = false, curTool = null, jpage = 0, dial = '';

  /* ---------- Субтитры с печатной машинкой ---------- */
  async function say(text, who = '', cls = '', opt = {}) {
    const tok = ++sayTok; skip = false;
    sub.className = 'sub show ' + cls; subWho.textContent = who; subTxt.textContent = '';
    const talking = cls === '' || cls === 'boss';
    Scene.S.talk = talking;
    const sp = CONFIG.textSpeed[SET.text];
    for (let i = 0; i < text.length; i++) {
      if (tok !== sayTok) return;
      if (skip) { subTxt.textContent = text; break; }
      subTxt.textContent = text.slice(0, i + 1);
      if (i % 2 === 0 && /[а-яёa-z]/i.test(text[i])) Snd.blip(opt.pitch || 1);
      await U.wait(/[.,!?…]/.test(text[i]) ? sp * 5 : sp);
    }
    if (tok === sayTok) Scene.S.talk = false;
    await U.wait(opt.hold || 250);
  }
  function hideSub() { sayTok++; sub.className = 'sub'; Scene.S.talk = false; }
  sub.addEventListener('click', e => { e.stopPropagation(); skip = true; });

  /* ---------- Тост и записки прежнего вахтёра ---------- */
  let toastT = 0;
  function toast(text, small = '') {
    const t = $('toast'); t.innerHTML = (small ? `<b>${esc(small)}</b>` : '') + esc(text);
    t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
  }
  let noteT = 0;
  function note(text, sig = '— С. П.') {
    const n = $('note'); n.innerHTML = esc(text) + `<span class="sig">${esc(sig)}</span>`;
    n.classList.add('show'); Snd.page(); clearTimeout(noteT); noteT = setTimeout(() => n.classList.remove('show'), 8000);
  }
  $('note').addEventListener('click', () => $('note').classList.remove('show'));

  /* ---------- HUD ---------- */
  function hud(G) {
    $('hud').classList.remove('hidden');
    const bulbs = $('bulbs');
    if (bulbs.children.length !== CONFIG.lives) { bulbs.innerHTML = ''; for (let i = 0; i < CONFIG.lives; i++) bulbs.append(h('div', 'bulb')); }
    [...bulbs.children].forEach((b, i) => { if (!b.classList.contains('breaking')) b.classList.toggle('dead', i >= G.lives); });
    $('tally').textContent = G.complaints ? 'I'.repeat(G.complaints) : '—';
    $('tally').title = `Жалоб: ${G.complaints} из ${CONFIG.maxComplaints}`;
    $('nightLbl').textContent = `ночь ${G.n}`;
  }
  function breakBulb(i) { const b = $('bulbs').children[i]; if (b) { b.classList.add('breaking'); setTimeout(() => { b.classList.remove('breaking'); b.classList.add('dead'); }, 650); } }
  function clock(minutes) { const m = Math.floor(minutes) % 1440; $('clock').textContent = `${U.pad(Math.floor(m / 60))}:${U.pad(m % 60)}`; }
  function patience(frac, on) {
    const p = $('patience'); p.classList.toggle('on', on); p.classList.toggle('low', frac < .3);
    p.firstElementChild.style.transform = `scaleX(${U.clamp(frac, 0, 1)})`;
  }

  /* ---------- Стол: инструменты и кнопки ---------- */
  function buildTools(allowed) {
    const box = $('tools'); box.innerHTML = '';
    ALL_TOOLS.forEach((k, i) => {
      const [label, spr] = TOOL_INFO[k];
      const b = h('button', 'tool'); b.dataset.tool = k;
      b.style.setProperty('--r', `${U.rand(-8, 8).toFixed(1)}deg`); b.style.setProperty('--tr', `${U.rand(-4, 3).toFixed(1)}deg`);
      b.append(Px.sprite(spr), h('span', 'tape', label), h('i', 'dot'), h('i', 'key', String(i + 1)));
      b.setAttribute('aria-label', label + (allowed.includes(k) ? '' : ' (недоступно)'));
      if (!allowed.includes(k)) b.classList.add('locked');
      b.addEventListener('click', () => { Snd.click(); openTool(k); });
      box.append(b);
    });
  }
  function toolEl(k) { return document.querySelector(`.tool[data-tool="${k}"]`); }
  function ping(k, on = true) { const e = toolEl(k); if (e) e.classList.toggle('ping', on); }
  function markUsed(k) { const e = toolEl(k); if (e) e.classList.add('used'); }
  function resetUsed() { document.querySelectorAll('.tool.used').forEach(e => e.classList.remove('used')); }
  function buttons(on) { $('btnIn').disabled = !on; $('btnOut').disabled = !on; }

  /* ---------- Выдвижной лист ---------- */
  function openSheet(title, node, tool) {
    sheetTitle.textContent = title; sheetBody.innerHTML = ''; sheetBody.append(node); sheetBody.scrollTop = 0;
    sheet.classList.add('open'); curTool = tool; Snd.page();
  }
  function closeSheet() { if (!sheet.classList.contains('open')) return; sheet.classList.remove('open'); curTool = null; }
  const isOpen = () => sheet.classList.contains('open');
  sheet.querySelector('.sheet-close').addEventListener('click', () => { Snd.click(); closeSheet(); });
  (() => { let y0 = null; const top = sheet.querySelector('.sheet-top');
    top.addEventListener('pointerdown', e => { y0 = e.clientY; });
    top.addEventListener('pointerup', e => { if (y0 != null && e.clientY - y0 > 36) closeSheet(); y0 = null; }); })();

  function openTool(k) {
    const G = Game.G, v = G.v;
    if (!G.running) return;
    if (!ANYTIME.includes(k) && !(v && G.deciding)) { toast('За стеклом пока никого нет.'); return; }
    if (v && G.deciding) { v.used.add(k); markUsed(k); }
    ping(k, false);
    ({ journal, passport, bag, phone, questions, intercom, drawer, radio })[k](G, v);
    Game.onTool(k);
  }

  /* ---------- Журнал жильцов ---------- */
  const PAGES = [{ k: 'rules' }, ...RES.map(r => ({ k: 'res', r })), { k: 'staff' }];
  function journal(G, v, page) {
    if (page != null) jpage = page;
    if (v && G.deciding) v.seen.add('journal');
    const wrap = h('div');
    const tabs = h('div', 'jtabs');
    PAGES.forEach((pg, i) => {
      const lbl = pg.k === 'rules' ? 'Правила' : pg.k === 'staff' ? 'Вахта' : `${pg.r.apt}·${pg.r.name[0]}`;
      const t = h('button', 'jtab' + (i === jpage ? ' on' : ''), lbl);
      t.addEventListener('click', () => { Snd.page(); jpage = i; journal(G, G.v); });
      tabs.append(t);
    });
    const J = h('div', 'journal');
    J.append(renderPage(PAGES[jpage], G));
    const nav = h('div', 'jnav');
    const prev = h('button', '', '‹ назад'), next = h('button', '', 'дальше ›');
    prev.onclick = () => flip(-1); next.onclick = () => flip(1);
    nav.append(prev, h('span', '', `стр. ${jpage + 1} / ${PAGES.length}`), next);
    J.append(nav);
    let x0 = null;
    J.addEventListener('pointerdown', e => { x0 = e.clientX; });
    J.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 48) flip(dx < 0 ? 1 : -1); });
    function flip(d) { jpage = (jpage + d + PAGES.length) % PAGES.length; Snd.page(); journal(G, G.v); const pg = sheetBody.querySelector('.jpage'); if (pg) pg.style.setProperty('--dx', (d * 24) + 'px'); }
    wrap.append(tabs, J);
    const keepScroll = isOpen() && curTool === 'journal';
    openSheet('Журнал жильцов', wrap, 'journal');
    if (keepScroll) { const on = tabs.querySelector('.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' }); }
    else setTimeout(() => { const on = tabs.querySelector('.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' }); }, 30);
    if (PAGES[jpage].k === 'staff') Game.onStaffPage();
  }
  function row(k, val) { return `<div class="jrow"><span class="jk">${k}</span>${esc(val)}</div>`; }
  function renderPage(pg, G) {
    if (pg.k === 'rules') {
      const d = h('div', 'rules');
      d.innerHTML = `<h3>Правила вахты</h3><ol>${RULES.map(r => `<li>${esc(r)}</li>`).join('')}</ol><p class="tonight">Сегодня: ${esc(G.cfg.rule)}</p>`;
      return d;
    }
    const d = h('div', 'jpage');
    const ph = h('div', 'jphoto');
    if (pg.k === 'staff') {
      ph.append(Px.photo(STAFF.app, 'journal')); d.append(ph);
      d.append(h('div', '', row('Вахтёр', `${STAFF.surname} ${STAFF.name} ${STAFF.patr}`) + row('Дата рождения', STAFF.dob) + row('Приметы', STAFF.signs) + row('Паспорт', `${STAFF.series} № ${STAFF.number}`) + `<div class="jnote strong">${esc(STAFF.note)}</div>`));
      return d;
    }
    const r = pg.r;
    ph.append(Px.photo(r.app, 'journal')); d.append(ph);
    const st = { away: 'Уехал(а)', dead: 'Умер', never: 'Не выходит' }[r.status];
    d.append(h('div', '', row('ФИО', `${r.surname} ${r.name} ${r.patr}`) + row('Квартира', `${r.apt}, ${floorOf(r.apt)}-й этаж`) + row('Дата рождения', r.dob) +
      row('Приметы', r.signs) + row('Проживает', r.household) + (r.note ? `<div class="jnote${st ? ' strong' : ''}">${st ? esc(st.toUpperCase()) + '. ' : ''}${esc(r.note)}</div>` : '')));
    return d;
  }

  /* ---------- Паспорт ---------- */
  function passport(G, v) {
    if (!v.used.has('passport_paid')) { v.used.add('passport_paid'); Game.spend(CONFIG.cost.passport); say(v.kind === 'boss' ? 'Бери. Он всегда был мой.' : U.pick(['Вот, пожалуйста.', 'Держите.', 'Да, конечно, вот.', 'Вот паспорт.']), whoOf(v), v.kind === 'boss' ? 'boss' : ''); }
    v.seen.add('passport');
    const P = v.passport;
    const w = h('div', 'pwrap'), pp = h('div', 'passport');
    pp.append(h('div', 'hdr', 'ПАСПОРТ ГРАЖДАНИНА РОССИЙСКОЙ ФЕДЕРАЦИИ'));
    const ph = h('div', 'pphoto'); ph.append(Px.photo(P.photo, 'pass')); pp.append(ph);
    pp.append(h('div', '', `<span class="pk">Фамилия</span><span class="pv">${esc(P.surname)}</span><span class="pk">Имя</span><span class="pv">${esc(P.name)}</span>` +
      `<span class="pk">Отчество</span><span class="pv">${esc(P.patr)}</span><span class="pk">Пол</span><span class="pv">${P.sex === 'f' ? 'ЖЕН.' : 'МУЖ.'}</span>` +
      `<span class="pk">Дата рождения</span><span class="pv">${esc(P.dob)}</span>`));
    pp.append(h('div', 'pser', `${esc(P.series)} ${esc(P.number)}`));
    w.append(pp, h('div', 'stamp', `<b>МЕСТО ЖИТЕЛЬСТВА</b>${esc(P.addr)}`));
    openSheet('Паспорт посетителя', w, 'passport');
    Game.onPassport();
  }
  function whoOf(v) { return v.kind === 'boss' ? 'Семён Палыч?' : 'За стеклом'; }

  /* ---------- Сумка ---------- */
  function bag(G, v) {
    if (!v.used.has('bag_paid')) { v.used.add('bag_paid'); Game.spend(CONFIG.cost.bag); }
    v.seen.add('bag');
    const g = h('div', 'bag'), desc = h('div', 'idesc', 'Нажмите на предмет.');
    v.bag.forEach((it, i) => {
      const b = h('button', 'item'); b.style.setProperty('--r', `${U.rand(-7, 7).toFixed(1)}deg`); b.style.animationDelay = (i * 70) + 'ms';
      b.append(Px.sprite(it.id), h('span', '', esc(it.n)));
      b.onclick = () => {
        g.querySelectorAll('.item').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
        desc.textContent = it.d; Snd.click();
        if (it.creepy) { Snd.stat(.3); Scene.shake(.25); vib(40); }
      };
      g.append(b);
    });
    g.append(desc);
    openSheet('Содержимое сумки', g, 'bag');
  }

  /* ---------- Телефон ---------- */
  function phone(G, v, tab = 'msgs') {
    if (!v.used.has('phone_paid')) { v.used.add('phone_paid'); Game.spend(CONFIG.cost.phone); }
    v.seen.add('phone');
    const ph = v.phone;
    const w = h('div', 'phone' + (ph.kind === 'button' ? ' button' : '')), scr = h('div', 'pscr'), tabs = h('div', 'ptabs');
    const list = [['msgs', 'Сообщ.'], ['calls', 'Звонки']]; if (ph.kind !== 'button') list.push(['gal', 'Галерея']);
    list.forEach(([k, l]) => { const t = h('button', 'ptab' + (k === tab ? ' on' : ''), l); t.onclick = () => { Snd.click(); phone(G, v, k); }; tabs.append(t); });
    scr.append(tabs);
    const body = h('div', 'plist');
    if (ph.note) body.append(h('div', 'pmsg', `<b>Система</b>${esc(ph.note)}`));
    if (tab === 'msgs') { if (!ph.msgs.length && !ph.note) body.append(h('div', 'pempty', 'Сообщений нет')); ph.msgs.forEach(m => body.append(h('div', 'pmsg', `<i>${esc(m.time)}</i><b>${esc(m.from)}</b>${esc(m.text)}`))); }
    if (tab === 'calls') { if (!ph.calls.length) body.append(h('div', 'pempty', 'Звонков нет')); ph.calls.forEach(c => body.append(h('div', 'pcall', `<span>${c.missed ? '↙ ' : '↗ '}${esc(c.who)}</span><span>${esc(c.time)}</span>`))); }
    if (tab === 'gal') {
      if (!ph.gallery.length) body.append(h('div', 'pempty', 'Фото нет'));
      const gg = h('div', 'pgal');
      ph.gallery.forEach(p => { const f = h('figure'); f.append(Px.thumb(p.type), h('figcaption', '', esc(p.cap))); gg.append(f); });
      body.append(gg);
    }
    scr.append(body); w.append(scr);
    openSheet('Телефон посетителя', w, 'phone');
  }

  /* ---------- Вопросы ---------- */
  function questions(G, v) {
    const pad = h('div', 'pad');
    v.questions.forEach(([k, q]) => {
      const b = h('button', 'q' + (v.asked.has(k) ? ' asked' : ''), esc(q));
      b.disabled = v.asked.has(k);
      pad.append(b);
      const a = h('div', 'ans', v.asked.has(k) ? '— ' + esc(v.answers[k]) : ''); pad.append(a);
      b.onclick = async () => {
        if (v.asked.has(k) || !G.deciding) return;
        v.asked.add(k); v.seen.add('questions'); Game.spend(CONFIG.cost.question);
        b.classList.add('asked'); b.disabled = true; Snd.click();
        await say(q, 'Вы', 'me', { hold: 120 });
        if (G.v !== v) return;
        await say(v.answers[k], whoOf(v), v.kind === 'boss' ? 'boss' : '', { pitch: v.voice });
        a.textContent = '— ' + v.answers[k];
      };
    });
    pad.append(h('div', 'padhint', `Каждый вопрос — около ${CONFIG.cost.question} секунд терпения.`));
    openSheet('Вопросы', pad, 'questions');
  }

  /* ---------- Домофон ---------- */
  function intercom(G, v) {
    const box = h('div', 'icom');
    box.append(h('div', 'grill'));
    const lcd = h('div', 'lcd'); box.append(lcd);
    const draw = (s = dial) => { lcd.innerHTML = `<small>КВ.</small>${esc(s || '—')}`; };
    draw();
    const keys = h('div', 'keys');
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'ВЫЗОВ'].forEach(k => {
      const b = h('button', 'key' + (k === 'C' ? ' clr' : k === 'ВЫЗОВ' ? ' call' : ''), k);
      if (k === 'ВЫЗОВ') b.style.fontSize = '14px';
      b.onclick = () => {
        Snd.click();
        if (k === 'C') { dial = ''; draw(); return; }
        if (k === 'ВЫЗОВ') { call(G, v, draw); return; }
        if (dial.length < 2) dial += k; draw();
      };
      keys.append(b);
    });
    box.append(keys);
    const quick = h('div', 'quick');
    const aptsSaid = new Set();
    if (v.kind === 'guest') aptsSaid.add(v.target);
    if (v.asked.has('apt')) { const m = /(\d+)/.exec(v.answers.apt); if (m) aptsSaid.add(+m[1]); }
    aptsSaid.forEach(a => { const c = h('button', 'chip', `кв. ${a}`); c.onclick = () => { dial = String(a); draw(); Snd.click(); }; quick.append(c); });
    if (aptsSaid.size) box.append(quick);
    openSheet('Внутренний домофон', box, 'intercom');
  }
  let calling = false;
  async function call(G, v, draw) {
    if (calling || !G.deciding) return;
    const apt = parseInt(dial, 10);
    if (!apt || apt > 36) { Snd.buzz(); draw('ОШИБКА'); return; }
    calling = true; Game.spend(CONFIG.cost.intercom);
    draw(`${apt} ···`); Snd.ring();
    await U.wait(1100);
    calling = false;
    if (G.v !== v || !G.deciding) return;
    const r = Gen.intercom(v, apt, { cfg: G.cfg, out: G.out });
    if (v.kind === 'boss' || apt === v.target || (v.res && apt === v.res.apt)) v.seen.add('intercom');
    if (r.kind === 'silence' || r.kind === 'broken') Snd.buzz();
    draw(String(apt));
    await say(r.line, r.who, 'icom', { pitch: 1.2 });
  }

  /* ---------- Ящик стола ---------- */
  function drawer(G, v) {
    const d = h('div', 'drawer');
    const read = STORY.filter(s => s.after < G.n);
    if (!read.length) d.append(h('div', 'dnote', '<b>Ящик стола</b>Пыль, скрепки, огрызок карандаша. И чей-то паспорт.'));
    read.forEach((s, i) => { const n = h('div', 'dnote', `<b>${esc(s.head)}</b>${esc(s.text)}`); n.style.setProperty('--r', `${(i % 2 ? 1 : -1) * U.rand(.5, 1.8)}deg`); d.append(n); });
    const pp = h('div', 'passport');
    pp.style.marginTop = '8px';
    pp.append(h('div', 'hdr', 'ПАСПОРТ. ЛЕЖИТ В ЯЩИКЕ С 14.10'));
    const ph = h('div', 'pphoto'); ph.append(Px.photo(STAFF.app, 'pass')); pp.append(ph);
    pp.append(h('div', '', `<span class="pk">Фамилия</span><span class="pv">${STAFF.surname}</span><span class="pk">Имя</span><span class="pv">${STAFF.name}</span><span class="pk">Отчество</span><span class="pv">${STAFF.patr}</span><span class="pk">Дата рождения</span><span class="pv">${STAFF.dob}</span>`));
    pp.append(h('div', 'pser', `${STAFF.series} ${STAFF.number}`));
    d.append(pp);
    if (v && G.deciding) v.seen.add('drawer');
    openSheet('Ящик стола', d, 'drawer');
    Game.onDrawer();
  }

  /* ---------- Радио ---------- */
  const STATIC = ['…ш-ш-ш… на Егорьевском… ш-ш…', '…и по заявкам полуночников — песня… ш-ш-ш…', '…ш-ш… не… ш-ш… не открывайте… ш-ш…', '…курс доллара… ш-ш-ш…', '…ш-ш-ш-ш-ш…'];
  function radio(G) {
    const r = h('div', 'radio'), box = h('div', 'rbox');
    box.append(h('div', 'rdial'));
    const lines = h('div');
    const fill = () => {
      lines.innerHTML = '';
      if (!G.radioLog.length) lines.append(h('div', 'rline', 'Тишина в эфире.'));
      G.radioLog.forEach(m => lines.append(h('div', 'rline' + (m.fake && G.revealFake ? ' fake' : ''), esc(m.text))));
    };
    fill();
    const btn = h('button', 'rbtn', 'Покрутить ручку');
    btn.onclick = () => { Snd.stat(.7); btn.textContent = U.pick(STATIC); };
    box.append(lines, btn); r.append(box);
    openSheet('Радио «Заречье», 66,4', r, 'radio');
  }

  return { say, hideSub, toast, note, hud, breakBulb, clock, patience, buildTools, ping, markUsed, resetUsed, buttons, openSheet, closeSheet, isOpen, openTool, whoOf, journal, get curTool() { return curTool; }, resetDial() { dial = ''; } };
})();
/* =====================================================================
   GameManager — ночи, решения, последствия, босс, экраны, сохранения.
   ===================================================================== */
const Game = (() => {
  const G = { running: false, deciding: false, paused: false, n: 1, lives: 3, complaints: 0, score: 0, totals: { c: 0, t: 0 },
    v: null, out: new Set(), cfg: CONFIG.nights[0], radioLog: [], log: [], nightScore: 0, streak: 0, runId: 0,
    patience: 0, patMax: 1, knocks: 0, vTime: 0, idx: 0, count: 1, resolve: null, bossLineT: 0, tutZoom: false, revealFake: false };
  const scr = $('screen');
  const alive = id => id === G.runId;
  const QUESTION_ERR = { wrongApt: 'apt', household: 'house', neighbor: 'neighbor', wrongTarget: 'who', wrongOrigin: 'from', bossDog: 'dog' };

  /* ---------- Сохранения, достижения, рекорды ---------- */
  const save = () => Store.set('vahta.save', { night: G.n, lives: G.lives, complaints: G.complaints, score: G.score, totals: G.totals });
  const ACHS = Store.get('vahta.ach', {});
  function unlock(id) {
    if (ACHS[id]) return;
    ACHS[id] = Date.now(); Store.set('vahta.ach', ACHS);
    const a = ACH.find(x => x.id === id); if (a) { UI.toast(a.t, 'Достижение'); Snd.good(); }
  }
  function record(ending) {
    const lb = Store.get('vahta.lb', []);
    const d = new Date();
    lb.push({ score: G.score, night: G.n, ending, acc: G.totals.t ? Math.round(G.totals.c / G.totals.t * 100) : 0, date: `${U.pad(d.getDate())}.${U.pad(d.getMonth() + 1)}` });
    lb.sort((a, b) => b.score - a.score);
    Store.set('vahta.lb', lb.slice(0, 10));
  }

  /* ---------- Экраны ---------- */
  function show(html, clear = false) { scr.className = 'show' + (clear ? ' clear' : ''); scr.innerHTML = html; scr.scrollTop = 0; }
  function hideScreen() { scr.className = ''; scr.innerHTML = ''; }
  function on(sel, fn) { const e = scr.querySelector(sel); if (e) e.addEventListener('click', () => { Snd.init(); Snd.thunk(); fn(); }); }

  function menu() {
    stopRun(); Scene.reset(); Scene.setMode('title'); Scene.S.flickRate = .06; Snd.hum(.6); Snd.tension(0);
    $('hud').classList.add('hidden'); UI.buttons(false); UI.patience(0, false); UI.hideSub(); UI.closeSheet();
    const sv = Store.get('vahta.save', null);
    show(`<div class="title-wrap"><h1 class="title">ВАХТА</h1><p class="tag">Семь ночей. Одна будка. Не открывай тем, кто похож.</p></div>
      <div class="card">
        ${sv ? `<button class="mbtn main" id="mCont">Продолжить<small>${CONFIG.nights[sv.night - 1].name} · очки ${sv.score}</small></button>` : ''}
        <button class="mbtn${sv ? '' : ' main'}" id="mNew">Заступить на смену${sv ? '<small>начать заново — сохранение сотрётся</small>' : ''}</button>
        <button class="mbtn" id="mHow">Как играть</button>
        <div class="row2"><button class="mbtn" id="mAch">Достижения</button><button class="mbtn" id="mLb">Рекорды</button></div>
        <button class="mbtn" id="mSet">Настройки</button>
        ${window.desktop ? '<button class="mbtn" id="mQuit">Выйти из игры</button>' : ''}
      </div>`, true);
    on('#mQuit', () => window.desktop.quit());
    on('#mCont', () => { Object.assign(G, loadSave()); nightCard(); });
    on('#mNew', () => { Store.del('vahta.save'); Object.assign(G, { n: 1, lives: CONFIG.lives, complaints: 0, score: 0, totals: { c: 0, t: 0 } }); save(); nightCard(); });
    on('#mHow', howTo); on('#mAch', achScreen); on('#mLb', lbScreen); on('#mSet', () => settings(menu));
  }
  function loadSave() { const s = Store.get('vahta.save', null); return s ? { n: s.night, lives: s.lives, complaints: s.complaints, score: s.score, totals: s.totals || { c: 0, t: 0 } } : { n: 1, lives: 3, complaints: 0, score: 0, totals: { c: 0, t: 0 } }; }

  function howTo() {
    show(`<div class="card" style="margin-top:6vh"><h2>Как стоять вахту</h2>
      <p>За стеклом — жилец, гость или двойник. Двойник копирует жильца, но где-то ошибается.</p>
      <p>Инструменты на столе: журнал жильцов (листается свайпом), паспорт, сумка, телефон, вопросы, домофон в квартиры, ящик стола и радио. Каждая проверка съедает терпение посетителя.</p>
      <p>Нажмите на окно — присмотритесь к лицу: моргает ли он, сколько пальцев на руке, куда падает тень, есть ли отражение в зеркале.</p>
      <p>Впустили двойника — гаснет лампочка. Три лампочки — конец. Не впустили своего — жалоба. Три жалобы — увольнение.</p>
      <p>Клавиши: 1–8 инструменты, Y — впустить, N — не впускать, Z или пробел — присмотреться, ← → — листать журнал, Enter — главная кнопка меню, F — полный экран, Esc — пауза.</p>
      <button class="mbtn" id="bk">Назад</button></div>`);
    on('#bk', menu);
  }
  function achScreen() {
    show(`<div class="card" style="margin-top:5vh"><h2>Достижения</h2>${ACH.map(a => `<div class="ach${ACHS[a.id] ? ' on' : ''}"><span class="medal"></span><div>${esc(a.t)}<small>${esc(a.d)}</small></div></div>`).join('')}<button class="mbtn" id="bk">Назад</button></div>`);
    on('#bk', menu);
  }
  function lbScreen() {
    const lb = Store.get('vahta.lb', []);
    const EN = { dawn: 'рассвет', relieved: 'смена сдана', quiet: 'тихий дом', shift: 'новая смена', fired: 'уволен', dark: 'свет погас' };
    show(`<div class="card" style="margin-top:5vh"><h2>Лучшие смены</h2>${lb.length ? lb.map((r, i) => `<div class="lb"><span>${i + 1}.</span><span>ночь ${r.night} · ${EN[r.ending] || r.ending} · ${r.acc}% · ${r.date}</span><b>${r.score}</b></div>`).join('') : '<p>Пока пусто. Отстойте первую смену.</p>'}<button class="mbtn" id="bk">Назад</button></div>`);
    on('#bk', menu);
  }
  function settings(back) {
    const tog = (id, v, a = 'вкл', b = 'выкл') => `<button class="tog${v ? ' on' : ''}" id="${id}">${v ? a : b}</button>`;
    show(`<div class="card" style="margin-top:5vh"><h2>Настройки</h2>
      <div class="set">Громкость <input type="range" id="sVol" min="0" max="1" step="0.05" value="${SET.vol}"></div>
      <div class="set">Звук ${tog('sMute', !SET.mute)}</div>
      <div class="set">Скорость текста <button class="tog on" id="sText">${['медленно', 'обычно', 'быстро'][SET.text]}</button></div>
      <div class="set">Мягкие скримеры ${tog('sSoft', SET.soft)}</div>
      <div class="set">Вибрация ${tog('sVib', SET.vib)}</div>
      <button class="mbtn" id="sRes">Сбросить прогресс и рекорды</button>
      <button class="mbtn" id="bk">Назад</button></div>`);
    const upd = () => settings(back);
    scr.querySelector('#sVol').addEventListener('input', e => { SET.vol = +e.target.value; saveSet(); });
    scr.querySelector('#sVol').addEventListener('change', () => Snd.knock(1, .6));
    on('#sMute', () => { SET.mute = !SET.mute; saveSet(); upd(); });
    on('#sText', () => { SET.text = (SET.text + 1) % 3; saveSet(); upd(); });
    on('#sSoft', () => { SET.soft = !SET.soft; saveSet(); upd(); });
    on('#sVib', () => { SET.vib = !SET.vib; saveSet(); vib(30); upd(); });
    let armed = false;
    on('#sRes', () => {
      const b = scr.querySelector('#sRes');
      if (!armed) { armed = true; b.innerHTML = 'Точно стереть всё?<small>нажмите ещё раз</small>'; return; }
      ['vahta.save', 'vahta.ach', 'vahta.lb'].forEach(k => Store.del(k)); Object.keys(ACHS).forEach(k => delete ACHS[k]);
      UI.toast('Прогресс сброшен'); armed = false; b.textContent = 'Сбросить прогресс и рекорды';
    });
    on('#bk', back);
  }

  /* ---------- Пауза ---------- */
  function pause() {
    if (!G.running || G.paused) return;
    G.paused = true; UI.closeSheet();
    const draw = () => {
      show(`<div class="card" style="margin-top:12vh"><h2>Пауза</h2><p>${esc(G.cfg.name)}. Терпение посетителя замерло.</p>
        <button class="mbtn main" id="pC">Продолжить</button><button class="mbtn" id="pS">Настройки</button>
        <button class="mbtn" id="pR">Начать ночь заново</button><button class="mbtn" id="pM">В меню<small>прогресс сохранён на начало ночи</small></button></div>`);
      on('#pC', resume); on('#pS', () => settings(draw)); on('#pR', restartNight); on('#pM', menu);
    };
    draw();
  }
  function resume() { G.paused = false; hideScreen(); }
  function restartNight() { Object.assign(G, loadSave()); nightCard(); }
  function stopRun() { G.runId++; G.running = false; G.deciding = false; G.paused = false; if (G.resolve) { const r = G.resolve; G.resolve = null; r('abort'); } }

  /* ---------- Карточка ночи ---------- */
  function nightCard() {
    $('note').classList.remove('show');
    stopRun(); Scene.reset(); Scene.setMode('game'); UI.hideSub(); UI.closeSheet();
    $('hud').classList.add('hidden'); UI.buttons(false); UI.patience(0, false);
    const cfg = CONFIG.nights[G.n - 1];
    Snd.hum(.8); Snd.tension(G.n === 7 ? .3 : 0);
    show(`<div class="night-num">${esc(cfg.name)}</div>
      <div class="card night-card"><p>Смена с ${U.pad(cfg.start[0])}:${U.pad(cfg.start[1])} до рассвета. Лампочек: ${G.lives}. Жалоб: ${G.complaints} из ${CONFIG.maxComplaints}.</p>
      <p class="rule-red">${esc(cfg.rule)}</p>
      <button class="mbtn main" id="go">Заступить</button><button class="mbtn" id="bk">В меню</button></div>`);
    on('#go', () => { hideScreen(); runNight(); });
    on('#bk', menu);
  }

  /* ---------- Ночь ---------- */
  async function runNight() {
    const id = ++G.runId;
    const cfg = G.cfg = CONFIG.nights[G.n - 1];
    const night = Gen.night(G.n);
    Object.assign(G, { running: true, deciding: false, paused: false, out: night.out, radioLog: [], log: [], nightScore: 0, streak: 0, idx: 0, count: night.visitors.length, revealFake: false, livesAtStart: G.lives });
    Scene.reset(); Scene.setMode('game'); Scene.S.flickRate = cfg.flicker;
    UI.buildTools(cfg.tools); UI.hud(G); UI.clock(cfg.start[0] * 60 + cfg.start[1]); UI.buttons(false); UI.resetDial();
    Snd.hum(1);
    await U.wait(900); if (!alive(id)) return;
    const first = cfg.radio.find(r => r.at === 0);
    if (first) { await radio(first); if (!alive(id)) return; }
    for (let i = 0; i < night.visitors.length; i++) {
      G.idx = i;
      const v = night.visitors[i];
      Scene.S.queue = cfg.queue ? night.visitors.length - i - 1 : 0;
      await U.wait(U.rand(700, 1500)); if (!alive(id)) return;
      const res = await visitor(v, id);
      if (!alive(id) || res === 'abort') return;
      if (res === 'ended') return;
      if (G.lives <= 0 || G.complaints >= CONFIG.maxComplaints) { gameOver(G.lives <= 0 ? 'dark' : 'fired'); return; }
    }
    await U.wait(800); if (!alive(id)) return;
    endNight();
  }

  async function radio(msg) {
    G.radioLog.push(msg);
    if (UI.curTool !== 'radio') UI.ping('radio');
    Snd.stat(.5); Snd.radioHiss(1);
    await UI.say(msg.text, 'Радио «Заречье», 66,4', 'radio', { hold: 900 });
    Snd.radioHiss(0);
  }

  async function visitor(v, id) {
    v.used = new Set(); G.v = v;
    const cfg = G.cfg;
    if (cfg.fakeRadio && v.res && v.res.id === cfg.fakeRadio) { const f = cfg.radio.find(r => r.fake); if (f) { await radio(f); if (!alive(id)) return 'abort'; } }
    if (v.kind === 'boss') {
      Scene.S.flickRate = .5; Scene.S.lift = Scene.S.liftTarget = 0; Scene.S.liftIdleT = 999; Snd.tension(.6); Snd.radioHiss(.6); Scene.startCracks();
      await UI.say('Радио хрипит само по себе. Лифт стоит на нулевом этаже. Такого этажа в доме нет.', '', 'me', { hold: 600 });
      Snd.radioHiss(0); if (!alive(id)) return 'abort';
    }
    UI.resetUsed();
    await Scene.enter(v); if (!alive(id)) return 'abort';
    Snd.knock(2, .6);
    G.patMax = v.kind === 'boss' ? CONFIG.boss.patience : cfg.patience; G.patience = G.patMax; G.knocks = 0; G.vTime = 0; G.bossLineT = 8;
    G.deciding = true; UI.buttons(true);
    const decision = new Promise(res => { G.resolve = res; });
    UI.say(v.greet, UI.whoOf(v), v.kind === 'boss' ? 'boss' : '', { pitch: v.voice });
    if (G.n === 1 && G.idx === 0) setTimeout(() => alive(id) && UI.note(TUT.first), 2500);
    if (v.tut) setTimeout(() => alive(id) && G.v === v && UI.note(TUT[v.tut]), 3000);
    const d = await decision;
    G.resolve = null; G.deciding = false; UI.buttons(false); UI.patience(0, false); UI.closeSheet(); Scene.S.zoomTarget = 0;
    if (d === 'abort' || !alive(id)) return 'abort';
    return consequences(v, d, id);
  }

  function decide(d) {
    if (!G.deciding || G.paused || !G.resolve) return;
    const btn = d === 'in' ? $('btnIn') : $('btnOut');
    btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 140);
    Snd.thunk(); vib(25);
    const r = G.resolve; G.resolve = null; r(d);
  }

  const THANKS = ['Спасибо. Спокойной ночи.', 'Ну наконец-то. Спасибо.', 'Спасибо, дежурный.', 'Благодарю. Доброй ночи.'];
  const ANGRY = ['Я здесь живу! Я на вас жалобу напишу!', 'Вы что себе позволяете?! Утром — к управдому!', 'Ну всё. Жалоба в управляющую. Вас уволят.'];
  const DBL_BYE = ['…Ещё увидимся, вахтёр.', 'Ты откроешь. Потом.', 'Хорошо смотришь. Пока.', 'Мы подождём. Мы умеем ждать.'];

  async function consequences(v, d, id) {
    if (v.kind === 'boss') return bossEnd(d, id);
    const real = v.truth === 'real';
    const who = UI.whoOf(v);
    const floor = v.kind === 'guest' ? floorOf(v.target) : floorOf(v.apt);
    const entry = { v, d, ok: false, neutral: false };
    G.log.push(entry);
    G.totals.t++;
    const pedantTools = ['journal', 'passport', 'bag', 'phone', 'questions', 'intercom'].filter(t => G.cfg.tools.includes(t));
    if (pedantTools.every(t => v.used.has(t))) unlock('pedant');

    if (d === 'in' && real) {
      good(entry);
      if (G.cfg.fakeRadio && v.res && v.res.id === G.cfg.fakeRadio) { unlock('radio'); G.revealFake = true; }
      UI.say(v.oddity === 'drunk' ? 'Спас-сибо… ик.' : U.pick(THANKS), who, '', { pitch: v.voice });
      await Scene.leave('lift', floor);
    } else if (d === 'in' && !real) {
      bad(entry); G.streak = 0;
      UI.say('Спасибо.', who, '', { pitch: v.voice * .8 });
      await Scene.leave('lift', floor); if (!alive(id)) return 'abort';
      await U.wait(700); if (!alive(id)) return 'abort';
      Scene.S.darkTarget = .85; Snd.heart(); await U.wait(900); if (!alive(id)) return 'abort';
      await Scene.screamer(v.app, SET.soft); vib([80, 40, 160]);
      G.lives--; UI.breakBulb(G.lives); Scene.S.darkTarget = 0;
      UI.toast(`Двойник в доме. ${v.kind === 'guest' ? 'Кв. ' + v.target : 'Кв. ' + v.apt}.`, 'Лампочка перегорела');
      UI.hud(G);
    } else if (d === 'out' && !real) {
      good(entry);
      if (G.vTime < CONFIG.quickReveal) unlock('quick');
      UI.say(U.pick(DBL_BYE), who, 'fake', { pitch: v.voice * .7 });
      await Scene.leave('reveal');
    } else if (d === 'out' && real) {
      bad(entry); complaint();
      UI.say(U.pick(ANGRY), who, '', { pitch: v.voice });
      await Scene.leave('out');
    } else { // ушёл, не дождавшись
      entry.neutral = true;
      if (real) { bad(entry); complaint(); UI.say('Всё. Пойду к соседям ночевать. А на вас — жалоба!', who, '', { pitch: v.voice }); }
      else { entry.ok = true; G.totals.c++; UI.say('…', who, 'fake'); }
      await Scene.leave('out');
    }
    UI.hideSub();
    return 'ok';
  }
  function good(entry) {
    entry.ok = true; G.totals.c++; G.streak++;
    const t = 1 - U.clamp(G.vTime / G.patMax, 0, 1);
    const pts = CONFIG.score.correct + Math.round(CONFIG.score.speed * t) + CONFIG.score.streak * Math.min(G.streak - 1, CONFIG.score.streakCap);
    G.score += pts; G.nightScore += pts; Snd.good();
  }
  function bad(entry) { entry.ok = false; G.streak = 0; Snd.bad(); }
  function complaint() {
    G.complaints++; Snd.stamp(); Scene.shake(.6); vib(60);
    const s = $('stampFx'); s.classList.remove('slam'); void s.offsetWidth; s.classList.add('slam');
    UI.hud(G);
  }

  /* ---------- Босс ---------- */
  const BOSS_LINES = ['Я тридцать лет на этом стуле сидел. Пусти.', 'Холодно внизу, сменщик. Очень холодно.', 'Ты мой чай пьёшь. Из моего стакана.', 'Открой. Я же свой. Я же ТОТ.', 'Зачем тебе журнал? Посмотри на меня.'];
  async function bossEnd(d, id) {
    const v = G.v;
    G.totals.t++;
    if (d === 'out') {
      G.totals.c++; G.score += CONFIG.score.boss; unlock('boss');
      await UI.say('Ты пожалеешь, сменщик. Я ещё…', 'Семён Палыч?', 'boss', { pitch: .6 });
      if (!alive(id)) return 'abort';
      for (let i = 0; i < 3; i++) {
        Snd.knock(4, 1 + i * .4); Scene.shake(.5 + i * .3); Snd.crack(); vib(60);
        await Scene.tween(.7, k => { Scene.S.crack = Math.min(1, Scene.S.crack + .012); }); if (!alive(id)) return 'abort';
      }
      Scene.S.crack = 1; Scene.breakLamp(); Scene.S.darkTarget = .95; vib([100, 50, 200]);
      await U.wait(700); Scene.S.v = null; Scene.S.phase = 'none';
      Snd.tension(0); Snd.hum(0);
      await U.wait(2200); if (!alive(id)) return 'abort';
      await UI.say('Тишина. Где-то наверху хлопнула дверь. Потом — ничего.', '', 'me', { hold: 800 });
      if (!alive(id)) return 'abort';
      G.running = false; Snd.dawn(); Scene.S.darkTarget = .25;
      await Scene.tween(4, k => { Scene.S.dawn = k; UI.clock(5 * 60 + 20 + k * 25); });
      if (!alive(id)) return 'abort';
      unlock('seven');
      const acc = G.totals.c / Math.max(1, G.totals.t);
      ending(acc >= .9 ? 'dawn' : acc >= .7 ? 'relieved' : 'quiet');
    } else {
      await UI.say(d === 'timeout' ? 'Не хочешь открывать — сам войду. У меня ключи от всего.' : 'Спасибо, сменщик. Теперь моя смена.', 'Семён Палыч?', 'boss', { pitch: .6 });
      if (!alive(id)) return 'abort';
      await Scene.leave('booth'); if (!alive(id)) return 'abort';
      Scene.S.darkTarget = 1; await U.wait(600);
      await Scene.screamer(v.app, SET.soft); vib([120, 40, 240]);
      if (!alive(id)) return 'abort';
      ending('shift');
    }
    return 'ended';
  }

  /* ---------- Конец ночи ---------- */
  function endNight() {
    G.running = false; G.deciding = false; UI.buttons(false); UI.closeSheet(); UI.hideSub(); $('note').classList.remove('show');
    const n = G.n, errors = G.log.filter(e => !e.ok).length;
    const flawless = G.log.length && errors === 0;
    if (n === 1) unlock('first');
    let bonus = '';
    if (flawless) { unlock('flawless'); if (G.lives < CONFIG.lives) { G.lives++; bonus = '<p>За чистую смену завхоз вкрутил новую лампочку.</p>'; } }
    const rows = G.log.map(e => {
      const v = e.v, real = v.truth === 'real';
      const res = e.d === 'in' ? 'впущен' : e.d === 'out' ? 'не впущен' : 'ушёл';
      let clues = '';
      if (!real) clues = v.errors.map(er => { const s = seenClue(v, er); return `<div class="clue ${s ? 'seen' : 'miss'}">${s ? 'видели' : 'упустили'}: ${esc(ERR[er].t)}</div>`; }).join('');
      else if (v.oddity) clues = `<div class="clue seen">${esc(ODD[v.oddity])} — это не признак двойника</div>`;
      if (real && G.cfg.fakeRadio && v.res && v.res.id === G.cfg.fakeRadio) clues += '<div class="clue miss">Радио солгало: это была настоящая Петрова</div>';
      return { v, html: `<div class="srow"><span class="cv"></span><div class="sname">${esc(v.label)}<small>${esc(v.sub)} · ${real ? 'настоящий' : 'ДВОЙНИК'}</small>${clues}</div><div class="sres ${e.ok ? 'ok' : 'bad'}">${res}<br>${e.ok ? 'верно' : 'ошибка'}</div></div>` };
    });
    G.n = n + 1; save();
    const correct = G.log.filter(e => e.ok).length;
    show(`<div class="card" style="margin-top:4vh"><h2>${esc(CONFIG.nights[n - 1].name)} позади</h2>
      <div class="sumlist">${rows.map(r => r.html).join('')}</div>
      <div class="stat">Верных решений <b>${correct} / ${G.log.length}</b></div>
      <div class="stat">Очки за ночь <b>${G.nightScore}</b></div>
      <div class="stat">Всего очков <b>${G.score}</b></div>
      <div class="stat">Лампочки / жалобы <b>${G.lives} / ${G.complaints}</b></div>${bonus}
      <button class="mbtn main" id="nx">Дальше</button></div>`);
    scr.querySelectorAll('.srow .cv').forEach((c, i) => c.replaceWith(Px.photo(rows[i].v.app, 'pass')));
    on('#nx', () => storyNote(n));
  }
  function seenClue(v, er) {
    const tool = ERR[er].tool;
    if (tool === 'questions') return v.asked.has(QUESTION_ERR[er]);
    if (tool === 'look') return er === 'mirror' ? true : v.seen.has('look');
    return v.seen.has(tool);
  }
  function storyNote(n) {
    const st = STORY.find(s => s.after === n);
    if (!st) { nightCard(); return; }
    show(`<div class="card" style="margin-top:14vh;background-color:#e9dea9"><h2 style="font-size:19px">${esc(st.head)}</h2><p style="font-size:21px">${esc(st.text)}</p>
      <button class="mbtn main" id="nx">${esc(CONFIG.nights[n].name)} →</button></div>`);
    Snd.page(); if (n === 2) Snd.stat(.8);
    on('#nx', nightCard);
  }

  function gameOver(kind) {
    G.running = false; G.deciding = false; UI.closeSheet(); UI.hideSub(); UI.buttons(false);
    record(kind);
    Snd.tension(0);
    const t = kind === 'fired' ? ['Уволен', 'Третья жалоба легла на стол управдома. Утром вам вручили трудовую. Кто теперь сидит в будке — лучше не знать.']
      : ['Свет погас', 'Последняя лампочка лопнула. В темноте подъезда кто-то постучал в стекло изнутри будки.'];
    show(`<div class="ending-title">${t[0]}</div><div class="card"><p>${t[1]}</p>
      <div class="stat">Очки <b>${G.score}</b></div><div class="stat">Дошли до <b>${esc(G.cfg.name.toLowerCase())}</b></div>
      <button class="mbtn main" id="rs">Перезапустить ночь</button><button class="mbtn" id="mm">В меню</button></div>`);
    on('#rs', restartNight); on('#mm', menu);
  }
  function ending(key) {
    G.running = false; UI.closeSheet(); UI.hideSub();
    const E = ENDINGS[key];
    if (key === 'dawn') unlock('perfect');
    record(key); Store.del('vahta.save');
    const acc = Math.round(G.totals.c / Math.max(1, G.totals.t) * 100);
    show(`<div class="ending-title">${esc(E.title)}</div><div class="card"><p>${esc(E.text)}</p>
      <div class="stat">Точность за семь ночей <b>${acc}%</b></div><div class="stat">Очки <b>${G.score}</b></div>
      <p style="font-size:15px;color:#6b5f4d">Концовок четыре. Точность решает, каким будет утро.</p>
      <button class="mbtn main" id="mm">В меню</button></div>`, key !== 'shift');
    on('#mm', menu);
  }

  /* ---------- Кадр ---------- */
  function update(dt) {
    if (!G.running || G.paused) return;
    const cfg = G.cfg;
    const frac = G.deciding ? 1 - G.patience / G.patMax : 0;
    const span = (5 * 60 + 30) + 24 * 60 - (cfg.start[0] * 60 + cfg.start[1]);
    UI.clock(cfg.start[0] * 60 + cfg.start[1] + span * (G.idx + frac * .8) / Math.max(1, G.count));
    if (!G.deciding) return;
    G.vTime += dt;
    G.patience -= dt * (cfg.queue ? 1.25 : 1);
    const f = G.patience / G.patMax;
    UI.patience(f, true);
    Snd.tension(U.clamp(1 - f, 0, 1) * (G.v.kind === 'boss' ? 1 : .75));
    if (Scene.zoomed()) G.v.seen.add('look');
    CONFIG.knockAt.forEach((k, i) => {
      if (G.knocks === i && f < k) {
        G.knocks++; Snd.knock(3 + i, .8 + i * .4); Scene.shake(.2 + i * .2); vib(30);
        const lines = G.v.kind === 'boss' ? ['Открой.', 'ОТКРОЙ.'] : G.v.truth === 'real' ? ['Ну долго ещё?!', 'Я сейчас уйду! Слышите?!'] : ['Откройте, пожалуйста.', 'Откройте. Пожалуйста. Откройте.'];
        UI.say(lines[i], UI.whoOf(G.v), G.v.kind === 'boss' ? 'boss' : '', { pitch: G.v.voice });
      }
    });
    if (G.v.kind === 'boss') {
      Scene.S.crack = Math.max(Scene.S.crack, U.clamp(1 - f, 0, 1) * .75);
      G.bossLineT -= dt;
      if (G.bossLineT <= 0) { G.bossLineT = U.rand(9, 13); if (!UI.isOpen() || Math.random() < .5) UI.say(U.pick(BOSS_LINES), 'Семён Палыч?', 'boss', { pitch: .6 }); Snd.crack(); }
    }
    if (G.patience <= 0 && G.resolve) { const r = G.resolve; G.resolve = null; r('timeout'); }
  }

  return {
    G, menu, pause, resume, decide, update, unlock,
    spend(sec) { if (G.deciding) G.patience = Math.max(.5, G.patience - sec); },
    onTool() {},
    onPassport() { if (G.n === 1 && !G.tutZoom) { G.tutZoom = true; setTimeout(() => G.deciding && UI.note(TUT.zoom), 1800); } },
    onStaffPage() { const v = G.v; if (v && v.kind === 'boss' && G.deciding && !v._jr) { v._jr = true; UI.say('Не верь журналу. Журнал пишут люди. А я — вот он.', 'Семён Палыч?', 'boss', { pitch: .6 }); } },
    onDrawer() { const v = G.v; if (v && v.kind === 'boss' && G.deciding && !v._dr) { v._dr = true; Snd.crack(); Scene.shake(.3); UI.say('Это старый. Выбрось его. Мой паспорт — у меня.', 'Семён Палыч?', 'boss', { pitch: .6 }); } },
  };
})();
/* =====================================================================
   Запуск: зерно плёнки, цикл кадров, ввод с тача, мыши и клавиатуры.
   ===================================================================== */
(() => {
  // Зерно VHS: генерируем шум один раз и кладём фоном оверлея
  const n = Px.mk(160, 160), nx = n.getContext('2d'), id = nx.createImageData(160, 160);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  nx.putImageData(id, 0, 0);
  $('grain').style.backgroundImage = `url(${n.toDataURL()})`;

  Scene.init();
  Snd.setVolume(SET.vol); Snd.setMuted(SET.mute);

  // Звук разрешён только после жеста игрока
  const unlockAudio = () => { Snd.init(); Snd.setVolume(SET.vol); Snd.setMuted(SET.mute); };
  window.addEventListener('pointerdown', unlockAudio, { passive: true });
  window.addEventListener('keydown', unlockAudio);

  // Тап по окну: закрыть лист или присмотреться
  $('stage').addEventListener('click', e => {
    if (e.target.closest('#pauseBtn') || e.target.closest('#sub')) return;
    if (UI.isOpen()) { UI.closeSheet(); return; }
    if (!Game.G.deciding) return;
    const z = Scene.toggleZoom();
    Snd.click();
    $('stage').style.cursor = z ? 'zoom-out' : 'zoom-in';
  });
  $('pauseBtn').addEventListener('click', e => { e.stopPropagation(); Snd.click(); Game.pause(); });
  $('btnIn').addEventListener('click', () => Game.decide('in'));
  $('btnOut').addEventListener('click', () => Game.decide('out'));

  window.addEventListener('keydown', e => {
    const G = Game.G;
    if ((e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') && !e.ctrlKey) { toggleFS(); return; }
    if (e.key === 'Enter' && $('screen').classList.contains('show')) { const m = $('screen').querySelector('.mbtn.main'); if (m) { e.preventDefault(); m.click(); } return; }
    if (e.key === 'Escape') { if (UI.isOpen()) UI.closeSheet(); else if (G.paused) Game.resume(); else Game.pause(); return; }
    if (!G.running || G.paused) return;
    const k = e.key.toLowerCase();
    if (k >= '1' && k <= '8') { const t = ALL_TOOLS[+k - 1]; if (G.cfg.tools.includes(t)) UI.openTool(t); }
    else if (k === 'y' || k === 'н') Game.decide('in');
    else if (k === 'n' || k === 'т') Game.decide('out');
    else if (k === 'z' || k === 'я' || k === ' ') { e.preventDefault(); if (G.deciding) Scene.toggleZoom(); }
    else if ((k === 'arrowleft' || k === 'arrowright') && UI.curTool === 'journal') { const b = document.querySelectorAll('.jnav button')[k === 'arrowleft' ? 0 : 1]; if (b) b.click(); }
  });
  function toggleFS() {
    try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (err) { /* полноэкранный режим недоступен */ }
  }
  // Свернули вкладку — пауза, чтобы терпение не утекло
  document.addEventListener('visibilitychange', () => { if (document.hidden && Game.G.running && !Game.G.paused) Game.pause(); });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    try { Scene.update(dt); Game.update(dt); Scene.render(); } catch (err) { console.error(err); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  Game.menu();
})();
</script>
<script>
/* Офлайн-режим и установка как приложение */
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
